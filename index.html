<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F2A1F">
<title>Munshi — Mobile Accessories Distribution</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Spline+Sans+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{
  --paper:#F5F3EC; --card:#FFFFFF; --ink:#182420; --ink2:#646F68; --ink3:#9AA39C;
  --line:#E4E0D3; --line2:#D3CFBF;
  --green:#0C6B4A; --green-soft:#E3EFE7; --green-ink:#0F2A1F; --green-ink2:#16382A;
  --red:#B23B2A; --red-soft:#F6E7E2; --amber:#A9720E; --amber-soft:#F5EBD4; --gold:#D9A441;
  --mono:'Spline Sans Mono',ui-monospace,Menlo,monospace;
  --disp:'Bricolage Grotesque',system-ui,sans-serif;
  --r:12px; --sh:0 1px 2px rgba(24,36,32,.05),0 10px 28px -16px rgba(24,36,32,.18);
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font:400 15px/1.5 var(--disp)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:500 16px var(--disp);color:var(--ink)}
input[type=number]{-moz-appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.mono{font-family:var(--mono)}
.muted{color:var(--ink2)}
.lbl{font:600 10.5px/1.4 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}
svg.ic{flex:none;display:block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:10px;font:600 14px var(--disp);border:1px solid transparent;transition:.15s}
.btn-primary{background:var(--green-ink);color:#F2F5EF}
.btn-primary:active{transform:translateY(1px)}
.btn-ghost{border-color:var(--line2);background:#fff}
.btn-danger{background:var(--red);color:#fff}
.btn-sm{padding:7px 12px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.45;pointer-events:none}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--ink2)}
.in,.sel{width:100%;border:1px solid var(--line2);background:#fff;border-radius:10px;padding:11px 12px}
.in:focus,.sel:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
.field{margin-bottom:14px}
.fl{display:block;font:600 10.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);margin-bottom:6px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border:1px solid var(--line2);border-radius:999px;background:#fff;font:600 12.5px var(--disp);color:var(--ink2);white-space:nowrap}
.chip.on{background:var(--green-ink);border-color:var(--green-ink);color:#F2F5EF}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font:600 11px var(--mono);letter-spacing:.04em}
.b-green{background:var(--green-soft);color:var(--green)} .b-red{background:var(--red-soft);color:var(--red)}
.b-amber{background:var(--amber-soft);color:var(--amber)} .b-gray{background:#EDEBE2;color:var(--ink2)}
.nbadge{min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font:700 10px/17px var(--mono);text-align:center;padding:0 5px;display:inline-block}
.authwrap{min-height:100vh;display:grid;grid-template-columns:1fr}
.aleft{display:none;background:var(--green-ink);color:#EAF0EA;padding:44px;position:relative;overflow:hidden}
.aleft .aruled{margin-top:auto;border-top:1px solid rgba(233,240,234,.18);font:500 12px var(--mono);color:#9DB4A6}
.arow{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px dashed rgba(233,240,234,.14)}
.mark{width:46px;height:46px;border-radius:12px;background:var(--gold);display:flex;align-items:center;justify-content:center;font:800 22px var(--disp);color:var(--green-ink)}
.aright{display:flex;flex-direction:column;justify-content:center;padding:32px 22px;background:var(--paper)}
.aright .card{max-width:420px;width:100%;margin:0 auto}
@media(min-width:900px){.authwrap{grid-template-columns:46% 54%}.aleft{display:flex;flex-direction:column}}
.ruled-bg{background-image:repeating-linear-gradient(0deg,transparent 0 27px,rgba(233,240,234,.07) 27px 28px)}
.authlinks{display:flex;justify-content:space-between;gap:10px;margin-top:14px;font-size:12.5px;flex-wrap:wrap}
.authlinks a{color:var(--green);font-weight:600}
.side{display:none;position:fixed;inset:0 auto 0 0;width:238px;background:var(--green-ink);color:#DCE6DD;z-index:30;flex-direction:column;padding:20px 14px;overflow-y:auto}
.sbrand{display:flex;align-items:center;gap:11px;padding:4px 8px 18px;border-bottom:1px solid rgba(233,240,234,.14);margin-bottom:14px}
.sbrand .mark{width:36px;height:36px;font-size:17px;border-radius:10px}
.sbrand b{font:700 17px var(--disp);color:#F2F6F0;display:block;line-height:1.1}
.sbrand span{font:500 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:#8FA795}
.sgroup{margin:14px 0 6px;padding:0 10px;font:600 9.5px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:#7E9A8A}
.slink{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;font:500 13.5px var(--disp);color:#C3D2C5;margin:1px 0}
.slink:hover{background:rgba(255,255,255,.06)}
.slink.on{background:rgba(255,255,255,.1);color:#fff;box-shadow:inset 3px 0 0 var(--gold)}
.sfoot{margin-top:auto;padding:12px 8px 4px;border-top:1px solid rgba(233,240,234,.14);display:flex;align-items:center;gap:10px}
.sfoot .avatar{background:var(--gold);color:var(--green-ink)}
.avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 12px var(--disp);background:var(--green-soft);color:var(--green);flex:none}
.main{min-height:100vh;padding-bottom:76px}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;background:rgba(245,243,236,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar h1{font:600 19px/1.15 var(--disp);letter-spacing:-.01em}
.tleft{display:flex;align-items:center;gap:10px;min-width:0}
.tleft h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tright{display:flex;align-items:center;gap:10px}
.tdate{font:500 11.5px var(--mono);color:var(--ink2);display:none}
@media(min-width:640px){.tdate{display:block}}
.uchip{display:flex;align-items:center;gap:8px}
.uchip .uname{display:none;font:600 13px var(--disp)}
@media(min-width:640px){.uchip .uname{display:block}}
#topBack{display:none}
#topBack.show{display:inline-flex}
.view{padding:16px;max-width:1160px;margin:0 auto;animation:vin .28s ease}
@keyframes vin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.bnav{position:fixed;bottom:0;left:0;right:0;z-index:40;display:flex;background:#fff;border-top:1px solid var(--line);padding:6px 6px calc(7px + env(safe-area-inset-bottom))}
.bnav a,.bnav button{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font:600 10px var(--disp);color:var(--ink3);border-radius:10px}
.bnav a.on,.bnav button.on{color:var(--green)}
.bnav .nbadge{position:absolute;top:1px;right:calc(50% - 24px)}
@media(min-width:1024px){
  .side{display:flex}.bnav{display:none}
  .main{margin-left:238px;padding-bottom:24px}
  .view{padding:26px 30px}
}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.ptitle{font:700 26px/1.1 var(--disp);letter-spacing:-.02em}
.psub{color:var(--ink2);font-size:13.5px;margin-top:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.cardhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.cardpad{padding:16px}
.grid2{display:grid;gap:14px}
@media(min-width:1024px){.grid2{grid-template-columns:1fr 1fr}}
.searchbar{position:relative;margin-bottom:12px}
.searchbar .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink3)}
.searchbar .in{padding-left:38px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
@media(min-width:900px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;box-shadow:var(--sh)}
.kpiV{font:700 21px/1.2 var(--mono);letter-spacing:-.02em;margin-top:6px}
.kpiD{font:500 10.5px var(--mono);color:var(--ink2);margin-top:3px}
.tint-g .kpiV{color:var(--green)} .tint-r .kpiV{color:var(--red)}
.list{display:flex;flex-direction:column}
.lrow{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);cursor:pointer;background:#fff}
.lrow:last-child{border-bottom:0}
.lrow:active{background:var(--paper)}
.lrow.editmode{cursor:default}
.lmain{flex:1;min-width:0}
.lname{font:600 14.5px var(--disp);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lsub{font:500 12px var(--mono);color:var(--ink2);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap}
.lright{text-align:right;flex:none}
.lamt{font:700 14.5px var(--mono);letter-spacing:-.01em}
.lmeta{font:500 11px var(--mono);color:var(--ink2);margin-top:2px}
.empty{padding:44px 20px;text-align:center;color:var(--ink2)}
.empty .big{font:700 19px var(--disp);color:var(--ink);margin:10px 0 4px}
.empty svg{color:var(--line2)}
.brow{display:grid;grid-template-columns:minmax(90px,1.1fr) 2fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.brow:last-child{border-bottom:0}
.bname{font:600 13.5px var(--disp);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bsub{font:500 10.5px var(--mono);color:var(--ink2)}
.btrack{height:9px;background:#EFECE2;border-radius:99px;overflow:hidden}
.btrack i{display:block;height:100%;border-radius:99px}
.bv{font:600 13px var(--mono);text-align:right;white-space:nowrap}
.sumrow{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media(min-width:760px){.sumrow{grid-template-columns:repeat(4,1fr)}}
.sum{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:11px 13px}
.sum b{display:block;font:700 17px var(--mono);letter-spacing:-.02em;margin-top:4px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.rangebar{margin-bottom:14px}
.rdates{display:flex;align-items:center;gap:8px;margin-top:10px}
.rdates .in{padding:8px 10px;font-size:14px}
.fline{display:grid;gap:8px;grid-template-columns:1fr 74px 92px 34px;grid-template-areas:"item item item item" "qty rate amt del";align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.fline .fl-item{grid-area:item}.fline .fl-qty{grid-area:qty}.fline .fl-rate{grid-area:rate}
.fline .fl-amt{grid-area:amt;font:600 12.5px var(--mono);text-align:right;color:var(--ink2)}
.fline .fl-del{grid-area:del}
@media(min-width:860px){.fline{grid-template-columns:2.2fr 90px 110px 110px 34px;grid-template-areas:"item qty rate amt del"}}
.trow{display:flex;justify-content:space-between;padding:6px 0;font-size:14px}
.trow b{font-family:var(--mono)}
.grand{border-top:2px solid var(--ink);margin-top:8px;padding-top:10px;font-size:16px}
.notice{display:flex;gap:9px;align-items:flex-start;background:var(--amber-soft);border:1px solid #E8D9B4;color:#7A5A14;border-radius:10px;padding:10px 12px;font-size:13px;margin:10px 0}
.notice.red{background:var(--red-soft);border-color:#E7C9C0;color:#8C3423}
.notice.green{background:var(--green-soft);border-color:#CBDFD0;color:var(--green)}
.savebar{display:flex;gap:10px;margin-top:18px}
.savebar .btn{flex:1}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.sego{position:relative}
.sego input{position:absolute;opacity:0;pointer-events:none}
.sego span{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border:1px solid var(--line2);border-radius:10px;background:#fff;font:600 13px var(--disp);color:var(--ink2);cursor:pointer}
.sego input:checked+span{background:var(--green-ink);border-color:var(--green-ink);color:#F2F5EF}
.lgrow{display:grid;grid-template-columns:1fr 66px 66px 84px;gap:8px;align-items:baseline;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13px}
.lgrow:last-child{border-bottom:0}
.lgrow .ld{min-width:0}
.lgrow .ld b{display:block;font:600 13px var(--disp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lgrow .ld span{font:500 10.5px var(--mono);color:var(--ink3)}
.lgrow .num{font:500 12px var(--mono);text-align:right}
.lgrow.hdr{border-bottom:1px solid var(--line2);font:600 9.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);padding-bottom:6px}
@media(min-width:760px){.lgrow{grid-template-columns:1fr 90px 90px 110px}}
.feedrow{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px dashed var(--line);cursor:pointer}
.feedrow:last-child{border-bottom:0}
.ftype{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
.lowrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.lowrow:last-child{border-bottom:0}
.chartwrap{position:relative}
.chartwrap svg{display:block;width:100%}
.ctip{position:absolute;top:8px;transform:translateX(-50%);background:var(--green-ink);color:#EDF3EC;border-radius:9px;padding:8px 11px;font:500 11px/1.6 var(--mono);pointer-events:none;white-space:nowrap;display:none;box-shadow:var(--sh);z-index:5}
.ctip .tr{display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.legend{display:flex;gap:16px;align-items:center}
.legend span{display:flex;align-items:center;gap:6px;font:500 11.5px var(--mono);color:var(--ink2)}
.pgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:760px){.pgrid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1080px){.pgrid{grid-template-columns:repeat(4,1fr)}}
.pcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px;display:flex;flex-direction:column;gap:8px;cursor:pointer;box-shadow:var(--sh);transition:.15s}
.pcard:active{transform:scale(.98)}
.ptile{width:100%;height:74px;border-radius:10px;display:flex;align-items:center;justify-content:center;font:800 26px var(--disp)}
.pbrand{font:600 9.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.pname{font:600 13.5px/1.3 var(--disp);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:35px}
.pprice{font:700 15px var(--mono);letter-spacing:-.01em}
.prow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:#fff}
.stepper button{width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:var(--ink2)}
.stepper span{min-width:36px;text-align:center;font:600 14px var(--mono)}
.cartrow{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px dashed var(--line)}
.cartrow:last-child{border-bottom:0}
.mask{position:fixed;inset:0;background:rgba(16,26,21,.46);backdrop-filter:blur(2px);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease}
@media(min-width:760px){.mask{align-items:center}}
@keyframes fade{from{opacity:0}}
.modal{background:#fff;border-radius:18px 18px 0 0;width:100%;max-width:520px;max-height:88vh;overflow:auto;animation:up .22s ease}
@media(min-width:760px){.modal{border-radius:18px}}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2}
.mhead h3{font:700 17px var(--disp)}
.mbody{padding:18px}
.mfoot{display:flex;gap:10px;padding:14px 18px;border-top:1px solid var(--line)}
.mfoot .btn{flex:1}
.sheet{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:520px;max-height:84vh;overflow:auto;animation:up .22s ease;padding-bottom:env(safe-area-inset-bottom)}
.shhead{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 6px}
.shhead b{font:700 18px var(--disp)}
.shg{padding:12px 18px 2px}
.shg .lbl{display:block;margin-bottom:6px}
.shlink{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px dashed var(--line);font:600 14.5px var(--disp)}
.shlink .ic{color:var(--ink2)}
.shlink .chev{margin-left:auto;color:var(--ink3)}
#toastRoot{position:fixed;left:0;right:0;bottom:calc(86px + env(safe-area-inset-bottom));z-index:90;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{display:flex;align-items:center;gap:9px;background:var(--green-ink);color:#F0F4EE;padding:11px 18px;border-radius:12px;font:600 13.5px var(--disp);box-shadow:var(--sh);animation:up .2s ease}
.toast.err{background:var(--red)}
body.locked{overflow:hidden}
.onboard{background:var(--green-ink);color:#E9F0E9;border-radius:16px;padding:26px 22px;margin-bottom:16px;position:relative;overflow:hidden}
.onboard h2{font:700 24px/1.15 var(--disp);letter-spacing:-.02em;margin:8px 0 6px}
.onboard p{color:#AFC3B2;font-size:13.5px;max-width:520px}
.onboard .btns{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn-gold{background:var(--gold);color:var(--green-ink)}
.btn-outline-l{border:1px solid rgba(233,240,234,.3);color:#E9F0E9}
.livewrap{display:flex;align-items:center;gap:8px;font:500 11px var(--mono);color:var(--ink2)}
.livewrap i{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.pimg{position:relative;width:100%;height:112px;border-radius:10px;overflow:hidden;background:#EFECE2}
.pimg img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .45s cubic-bezier(.2,.7,.3,1)}
.pcard:hover .pimg img,.pcard:focus-within .pimg img{transform:scale(1.7)}
.pimg .phZ{position:absolute;right:8px;bottom:8px;background:rgba(15,42,31,.65);color:#fff;border-radius:8px;padding:3px 8px;font:600 10px var(--mono);opacity:0;transition:.25s;pointer-events:none;display:flex;align-items:center;gap:4px}
.pcard:hover .phZ{opacity:1}
.pimg.big{height:210px;cursor:zoom-in;margin-bottom:4px}
.pimg.big.zoomed{cursor:zoom-out}
.pimg.big.zoomed img{transform:scale(2)}
.imthumb{width:38px;height:38px;border-radius:9px;object-fit:cover;flex:none;background:#EFECE2}
.photopick{display:flex;gap:12px;align-items:center}
.photopick .pv{width:76px;height:76px;border-radius:12px;overflow:hidden;background:#EFECE2;display:flex;align-items:center;justify-content:center;color:var(--ink3);flex:none}
.photopick .pv img{width:100%;height:100%;object-fit:cover}
.poswrap{background:var(--green-ink);border-radius:16px;color:#EAF0EA;padding:18px 18px 14px;margin-bottom:14px;position:relative;overflow:hidden}

function attachCombo(input,opts){
 let box=null;

 const open=()=>{
  const q=(input.value||'').trim().toLowerCase();
  const pool=opts.getPool().filter(o=>!q||String(o.label).toLowerCase().includes(q)||String(o.sub||'').toLowerCase().includes(q)).slice(0,10);
  close();
  if(!pool.length){
   if(q){box=document.createElement('div');box.className='combo';box.innerHTML='<div class="combo-empty">No match found</div>';insert()}
   return}
  box=document.createElement('div');box.className='combo';
  box.innerHTML=pool.map((o,i)=>`<div class="combo-it" data-i="${i}"><b>${esc(o.label)}</b><span>${esc(o.sub||'')}</span></div>`).join('');
  insert();
  box.querySelectorAll('.combo-it').forEach(el=>{
   el.addEventListener('pointerdown',e=>{e.preventDefault();const o=pool[+el.dataset.i];input.value=o.label;close();opts.onPick&&opts.onPick(o)})});
 };
 input.addEventListener('input',open);
 input.addEventListener('focus',open);
 input.addEventListener('blur',()=>setTimeout(close,160));
}

function resizeImage(file,maxEdge,quality){return new Promise((res,rej)=>{
 const rd=new FileReader();
 rd.onload=()=>{const img=new Image();
  img.onload=()=>{const sc=Math.min(1,maxEdge/Math.max(img.width,img.height));
   const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
   c.getContext('2d').drawImage(img,0,0,c.width,c.height);
   res(c.toDataURL('image/jpeg',quality))};
  img.onerror=()=>rej(new Error('bad image'));img.src=rd.result};
 rd.onerror=()=>rej(new Error('read failed'));rd.readAsDataURL(file)})}

/* ---- 1) Brand scope: applies to any role; super is always unrestricted.
   Empty allocation intentionally means all brands, matching the allocation UI. */
function brandScopeOf(me) {
  if (!me || me.role === 'super') return null;

  // Support the allocation field names used by different versions.
  const fields = [me.allocatedBrands, me.assignedBrandIds, me.brandIds];
  const brands = [...new Set(
    fields
      .flatMap(value => Array.isArray(value) ? value : [])
      .map(value => String(value || '').trim())
      .filter(Boolean)
  )];

  // Preserve the app's existing policy: an empty allocation is unrestricted.
  return brands.length ? brands : null;
}

function subscribeBrandScope(me) {
  const brands = brandScopeOf(me);
  if (!brands) return null;

  // Load allocated brand records only. Product listeners remain in subscribeAll().
  brands.forEach(id => {
    DB.collection('brands').doc(id).get()
      .then(doc => {
        if (!doc.exists) return;
        const brand = Object.assign({ id: doc.id }, doc.data());
        state.brands = [
          ...(state.brands || []).filter(item => item.id !== doc.id),
          brand
        ];
        onLive();
      })
      .catch(error => {
        console.error('Brand lookup failed:', id, error.code || error);
      });
  });

  return brands;
}

const canBillParty=pid=>{const p=partyById(pid);return !(p&&p.billingBlocked)};

  if(canBillParty(pid))return true;
  const p=partyById(pid);
  toast('Billing is blocked for '+esc(p?p.name:'this party')+' — only an admin can reactivate','err');
  return false;
}
function toggleBlockParty(pid){
  if(!isMgr())return toast('Only admin / super admin can change billing block','err');
  const p=partyById(pid);if(!p)return;
  const doIt=()=>{const next=!p.billingBlocked;
    dbUpdate('parties',pid,{billingBlocked:next});
    toast(next?'Billing blocked — new invoices stopped for '+p.name:'Billing reactivated for '+p.name);
    route()};
  if(!p.billingBlocked)confirmBox('Block billing for '+esc(p.name)+'?','New sale invoices will be refused until an admin reactivates this party.',doIt);
  else doIt();
}

  return `<div class="notice red" style="margin:12px 0">${ic('alert',16)}<div><b>Billing blocked.</b> New sale invoices cannot be created for ${esc(p.name)} until an admin reactivates the account.${btn}</div></div>`;

async function saveLedgerTxn(pid,kind){

function subscribeAll(me){
 if(me.role==='onlineStaff'){
  const bscope = subscribeBrandScope(me);
  let itemQuery = DB.collection('items');
  if (bscope) {
   const chunks = [];
   for (let i = 0; i < bscope.length; i += 10) chunks.push(bscope.slice(i, i + 10));
   const byChunk = new Map();
   chunks.forEach((ids, index) => {
    S.unsubs.push(itemQuery.where('brandId', 'in', ids).onSnapshot(snapshot => {
     byChunk.set(index, snapshot.docs.map(d => Object.assign({id: d.id}, d.data())));
     state.items = [...byChunk.values()].flat();
     onLive();
    }, error => console.error('Brand item subscription failed:', error.code || error)));
   });
  } else {
   S.unsubs.push(itemQuery.onSnapshot(snapshot => {
    state.items = snapshot.docs.map(d => Object.assign({id: d.id}, d.data()));
    onLive();
   }, error => console.error('Items subscription failed:', error.code || error)));
  }
  S.unsubs.push(DB.collection('orders').where('staffId','==',me.id).onSnapshot(s=>{state.orders=s.docs.map(d=>Object.assign({id:d.id},d.data()));onLive()},e=>console.error('online orders',e.code)));

 }
 if(me.role==='company'){

    let rows=snap.docs.map(d=>Object.assign({id:d.id},d.data()));

  },err=>{if(err.code!=='permission-denied')console.error(c,err)}))};

 if(me.role==='customer'){

   S.unsubs.push(ref.onSnapshot(snap=>{state[c]=snap.docs.map(d=>Object.assign({id:d.id},d.data()));onLive()},err=>{if(err.code!=='permission-denied')console.error(c,err)}))};

   S.unsubs.push(DB.collection('parties').doc(me.partyId).onSnapshot(s=>{state.myParty=s.exists?Object.assign({id:s.id},s.data()):null;onLive()}))}

  return}
 const bscope=subscribeBrandScope(me);
 COLLECTION_KEYS.forEach(c=>{

const cartGet=()=>LS.get(cartKey(),[]);

function cartAdd(id,qty){const it=itemById(id);if(!it)return;const st=stockOf(id);
 if(st<=0)return toast('Out of stock','err');
 const c=cartGet();const l=c.find(x=>x.itemId===id);const cur=l?l.qty:0;const want=Math.min(st,cur+qty);
 if(want<=cur)return toast('Limited stock — try a lower quantity','err');
 if(l)l.qty=want;else c.push({itemId:id,qty:want});cartSet(c);toast('Added to cart')}
function cartSetQty(id,qty){const c=cartGet();const i=c.findIndex(x=>x.itemId===id);if(i<0)return;
 const st=stockOf(id);qty=Math.max(0,Math.min(st,qty));if(!qty)c.splice(i,1);else c[i].qty=qty;cartSet(c)}

function stockOf(itemId){let q=+(itemById(itemId)?.openingStock)||0;
 PURCHASES().forEach(d=>LINES(d).forEach(l=>{if(l.itemId===itemId)q+=(+l.qty||0)}));
 SALES().forEach(d=>LINES(d).forEach(l=>{if(l.itemId===itemId)q-=(+l.qty||0)}));
 PRET().forEach(d=>{if(d.goodsBack!==false)LINES(d).forEach(l=>{if(l.itemId===itemId)q-=(+l.qty||0)})});
 SRET().forEach(d=>{if(d.goodsBack!==false)LINES(d).forEach(l=>{if(l.itemId===itemId)q+=(+l.qty||0)})});
 ADJ().forEach(a=>{if(a&&a.itemId===itemId)q+=(+a.delta||0)});
 return q}
function avgCost(it){let q=+(it.openingStock)||0,v=q*(+(it.openingRate)||+(it.purchaseRate)||0);
 PURCHASES().forEach(d=>LINES(d).forEach(l=>{if(l.itemId===it.id){q+=(+l.qty||0);v+=(+l.qty||0)*(+l.rate||0)}}));
 ADJ().forEach(a=>{if(a&&a.itemId===it.id&&+a.delta>0&&+a.rate)v+=(+a.delta)*(+a.rate),q+=(+a.delta)});
 return q>0?v/q:((+(it.purchaseRate))||(+(it.openingRate))||0)}
function stockRows(){return ITEMS().map(it=>{const qty=stockOf(it.id);return{it,qty,ac:avgCost(it),value:qty*avgCost(it)}}).sort((a,b)=>b.value-a.value)}
function docSub(d){return sum(LINES(d),l=>(+l.qty||0)*(+l.rate||0))}
function saleLinesOf(invs){const rows=[];(invs||[]).forEach(d=>{const sub=docSub(d);LINES(d).forEach(l=>{const g=(+l.qty||0)*(+l.rate||0);rows.push({itemId:l.itemId,qty:+l.qty||0,gross:g,net:g-((+d.discount||0)*(sub?g/sub:0)),date:d.date})})});return rows}
function purchaseLinesOf(docs){const rows=[];(docs||[]).forEach(d=>LINES(d).forEach(l=>rows.push({itemId:l.itemId,qty:+l.qty||0,amt:(+l.qty||0)*(+l.rate||0),date:d.date})));return rows}

 SALES().filter(d=>d.partyId===pid).forEach(d=>{es.push({date:d.date,desc:'Sale Invoice',ref:d.no,dr:+d.total,cr:0,pr:1,_c:d.created,link:'sales/view/'+d.id});if(+d.paid)es.push({date:d.date,desc:'Cash with invoice',ref:d.no,dr:0,cr:+d.paid,pr:2,_c:d.created})});
 PURCHASES().filter(d=>d.partyId===pid).forEach(d=>{es.push({date:d.date,desc:'Purchase Invoice',ref:d.no,dr:0,cr:+d.total,pr:1,_c:d.created,link:'purchases/view/'+d.id});if(+d.paid)es.push({date:d.date,desc:'Cash paid with invoice',ref:d.no,dr:+d.paid,cr:0,pr:2,_c:d.created})});
 SRET().filter(d=>d.partyId===pid).forEach(d=>{if(d.settle==='credit')es.push({date:d.date,desc:'Sale Return'+(d.goodsBack!==false?'':' (credit only)'),ref:d.no,dr:0,cr:+d.total,pr:3,_c:d.created,link:'sale-returns/view/'+d.id});else es.push({date:d.date,desc:'Sale Return — cash settled',ref:d.no,dr:0,cr:0,pr:3,_c:d.created,memo:true})});
 PRET().filter(d=>d.partyId===pid).forEach(d=>{if(d.settle==='credit')es.push({date:d.date,desc:'Purchase Return'+(d.goodsBack!==false?'':' (credit only)'),ref:d.no,dr:+d.total,cr:0,pr:3,_c:d.created,link:'purchase-returns/view/'+d.id});else es.push({date:d.date,desc:'Purchase Return — cash settled',ref:d.no,dr:0,cr:0,pr:3,_c:d.created,memo:true})});
 RECEIPTS().filter(r=>r.partyId===pid).forEach(r=>es.push({date:r.date,desc:'Cash received'+(r.note?' — '+r.note:''),ref:r.no||r.mode,dr:0,cr:+r.amount,pr:4,_c:r.created}));
 PAYMENTS().filter(r=>r.partyId===pid).forEach(r=>es.push({date:r.date,desc:'Cash paid'+(r.note?' — '+r.note:''),ref:r.no||r.mode,dr:+r.amount,cr:0,pr:4,_c:r.created}));
 return es.sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999')||a.pr-b.pr||(a._c||0)-(b._c||0))}
function partyBalance(pid){return sum(partyEntries(pid),e=>e.dr-e.cr)}

/* ================= DATE / RANGE / TAB HELPERS (shared by all reports) ================= */
const mk=(from,to)=>({from,to});
const inR=(d,f,t)=>{d=String(d||'').slice(0,10);return (!f||d>=f)&&(!t||d<=t)};
function presetRange(p){const t=todayISO();
 switch(p){
  case 'today':return[t,t];
  case '7d':return[addDays(t,-6),t];
  case 'month':return[monthStart(t),t];
  case 'lmonth':{const e=addDays(monthStart(t),-1);return[monthStart(e),e]}
  case '30d':return[addDays(t,-29),t];
  case 'ytd':return[t.slice(0,4)+'-01-01',t];
  case 'all':return['2000-01-01',t];
  default:return[monthStart(t),t]}}
function rangeBar(key){const r=S.report[key];
 const presets=[['today','Today'],['7d','This week'],['month','This month'],['lmonth','Last month'],['30d','Last 30 days'],['ytd','This year'],['all','All time']];
 return `<div class="rangebar card cardpad"><div class="tabs" style="margin-bottom:0">${presets.map(([k,l])=>`<button class="chip ${r.preset===k?'on':''}" data-rp="${k}">${l}</button>`).join('')}</div>
 <div class="rdates"><label style="flex:1"><span class="fl">From</span><input class="in" type="date" data-rfrom value="${r.from}"></label>
 <span style="padding-top:18px">→</span>
 <label style="flex:1"><span class="fl">To</span><input class="in" type="date" data-rto value="${r.to}"></label></div></div>`}
function bindRange(key){
 qsa('[data-rp]').forEach(b=>b.onclick=()=>{const p=b.dataset.rp;const[f,t]=presetRange(p);
  S.report[key]=Object.assign({},S.report[key],{preset:p,from:f,to:t});route()});
 qsa('[data-rfrom]').forEach(i=>i.onchange=e=>{S.report[key].from=e.target.value||'2000-01-01';S.report[key].preset='custom';route()});
 qsa('[data-rto]').forEach(i=>i.onchange=e=>{S.report[key].to=e.target.value||todayISO();S.report[key].preset='custom';route()})}
function tabsHtml(key,cur,pairs){return `<div class="tabs">${pairs.map(([k,l])=>`<button class="chip ${cur===k?'on':''}" data-rt="${k}">${l}</button>`).join('')}</div>`}
function bindTabs(key){qsa('[data-rt]').forEach(b=>b.onclick=()=>{S.report[key].tab=b.dataset.rt;route()})}

/* ================= REPORT WIDGETS ================= */
function sumTile(label,val,color){return `<div class="sum"${color?` style="border-bottom:3px solid ${color}"`:''}><span class="lbl">${esc(label)}</span><b>${val}</b></div>`}
function barRow(name,sub,val,max,color){const pct=Math.max(2,Math.min(100,(Math.abs(val)/Math.max(1,max))*100));
 return `<div class="brow"><div><span class="bname">${esc(name)}</span>${sub?`<span class="bsub">${esc(sub)}</span>`:''}</div>
 <div class="btrack"><i style="width:${pct}%;background:${color}"></i></div><div class="bv">${money(val)}</div></div>`}
function emptyHtml(icon,msg){return `<div class="empty">${ic(icon||'box',34)}<div class="big">${esc(msg)}</div></div>`}

/* ================= ROUTER ================= */
function routeAllowed(seg){const r=S.me.role;
 if(r==='super'||r==='admin')return true;
 if(r==='onlineStaff')return['online','profile'].includes(seg[0]);
 if(r==='customer')return['shop','cart','my-orders','parties','profile'].includes(seg[0]);
 if(r==='company'||r==='staff')return!['users','settings'].includes(seg[0]);
 return false}
function route(){
 if(S.booting)return;
 if(!S.me){vLogin();return}
 if(!$('#view')){renderShell()}
 const h=(location.hash||'').replace(/^#\/?/,'');
 const seg=h.split('/').filter(x=>x!=='');
 if(!seg.length){go(homeFor(S.me));return}
 if(!routeAllowed(seg)){toast('You do not have access to that page','err');go(homeFor(S.me));return}
 const p0=seg[0],p1=seg[1],p2=seg[2];
 if(p0==='login'){go(homeFor(S.me));return}
 try{
  if(p0==='dashboard')vDash();
  else if(p0==='parties'&&p1==='new')vPartyForm(null);
  else if(p0==='parties'&&p1==='edit'&&p2)vPartyForm(p2);
  else if(p0==='parties'&&p1)vPartyDetail(p1);
  else if(p0==='parties')vParties();
  else if(p0==='sales'&&p1==='new')vDocForm('sale',null);
  else if(p0==='sales'&&p1==='edit'&&p2)vDocForm('sale',p2);
  else if(p0==='sales'&&p1==='view'&&p2)vDocView('sale',p2);
  else if(p0==='sales')vDocs('sale');
  else if(p0==='purchases'&&p1==='new')vDocForm('purchase',null);
  else if(p0==='purchases'&&p1==='edit'&&p2)vDocForm('purchase',p2);
  else if(p0==='purchases'&&p1==='view'&&p2)vDocView('purchase',p2);
  else if(p0==='purchases')vDocs('purchase');
  else if(p0==='sale-returns'&&p1==='new')vDocForm('saleReturn',null);
  else if(p0==='sale-returns'&&p1==='edit'&&p2)vDocForm('saleReturn',p2);
  else if(p0==='sale-returns'&&p1==='view'&&p2)vDocView('saleReturn',p2);
  else if(p0==='sale-returns')vDocs('saleReturn');
  else if(p0==='purchase-returns'&&p1==='new')vDocForm('purchaseReturn',null);
  else if(p0==='purchase-returns'&&p1==='edit'&&p2)vDocForm('purchaseReturn',p2);
  else if(p0==='purchase-returns'&&p1==='view'&&p2)vDocView('purchaseReturn',p2);
  else if(p0==='purchase-returns')vDocs('purchaseReturn');
  else if(p0==='receipts'&&p1==='new')vCashForm('receipts');
  else if(p0==='receipts')vCash('receipts');
  else if(p0==='payments'&&p1==='new')vCashForm('payments');
  else if(p0==='payments')vCash('payments');
  else if(p0==='items'&&p1==='new')vItemForm(null);
  else if(p0==='items'&&p1==='edit'&&p2)vItemForm(p2);
  else if(p0==='items')vItems();
  else if(p0==='categories')vCats();
  else if(p0==='brands')vBrands();
  else if(p0==='stock'&&p1==='adjust')vStockAdj();
  else if(p0==='stock')vStock();
  else if(p0==='users')vUsers();
  else if(p0==='reports')vReports();
  else if(p0==='r'&&p1==='sales')vReportSales();
  else if(p0==='r'&&p1==='purchase')vReportPurchase();
  else if(p0==='r'&&p1==='collection')vReportCollection();
  else if(p0==='r'&&p1==='payment')vReportPayment();
  else if(p0==='r'&&p1==='profit')vReportProfit();
  else if(p0==='orders'&&p1)vOrderDetail(p1,false);
  else if(p0==='orders')vOrders();
  else if(p0==='shop')vShop();
  else if(p0==='cart')vCart();
  else if(p0==='my-orders'&&p1)vOrderDetail(p1,true);
  else if(p0==='my-orders')vMyOrders();
  else if(p0==='online')vOnlineStaff();
  else if(p0==='settings')vSettings();
  else if(p0==='profile')vProfile();
  else if(p0==='setup')vSetup();
  else{go(homeFor(S.me));return}
 }catch(err){showFatal(err.message||err)}
 window.scrollTo(0,0)}

/* ================= PARTIES ================= */
function partyKindOf(p){return p&&((p.type||p.kind)==='supplier')?'supplier':'customer'}
function partyTypeBadge(p){const s=partyKindOf(p)==='supplier'?'Supplier':'Customer';
 return `<span class="badge ${partyKindOf(p)==='supplier'?'b-amber':'b-green'}">${s}</span>`}
function balLabel(pid){const p=partyById(pid);if(!p)return['—','b-gray'];
 const bal=partyBalance(pid),sup=partyKindOf(p)==='supplier';
 if(Math.abs(bal)<0.004)return['Settled','b-gray'];
 if(sup)return bal<0?['We owe '+money(-bal),'b-red']:['Advance '+money(bal),'b-green'];
 return bal>0?['Due '+money(bal),'b-red']:['Advance '+money(-bal),'b-green']}

function vParties(){setTop('Parties');setActiveNav('parties');
 if(S.me.role==='customer'){if(S.me.partyId)return vPartyDetail(S.me.partyId);
  V().innerHTML='<div class="card"><div class="empty">Your account is not linked to a customer profile. Contact admin.</div></div>';return}
 let q='',tf='all';
 const draw=()=>{
  const list=PARTIES().filter(p=>tf==='all'||partyKindOf(p)===tf)
   .filter(p=>!q||(p.name+' '+(p.phone||'')+' '+(p.address||'')).toLowerCase().includes(q))
   .sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  const custs=PARTIES().filter(p=>partyKindOf(p)!=='supplier').length,sups=PARTIES().length-custs;
  const totalDue=sum(PARTIES().filter(p=>partyKindOf(p)!=='supplier'),p=>Math.max(0,partyBalance(p.id)));
  const totalPay=sum(PARTIES().filter(p=>partyKindOf(p)==='supplier'),p=>Math.max(0,-partyBalance(p.id)));
  V().innerHTML=`<div class="pagehead"><div><div class="ptitle">Parties</div><div class="psub">${custs} customers · ${sups} suppliers</div></div>
   <button class="btn btn-primary btn-sm" id="pNew">${ic('plus',15)}New party</button></div>
  <div class="sumrow">${sumTile('To collect',money(totalDue),'var(--red)')}${sumTile('To pay',money(totalPay),'var(--amber)')}</div>
  <div class="tabs"><button class="chip ${tf==='all'?'on':''}" data-ptf="all">All</button>
   <button class="chip ${tf==='customer'?'on':''}" data-ptf="customer">Customers</button>
   <button class="chip ${tf==='supplier'?'on':''}" data-ptf="supplier">Suppliers</button></div>
  <div class="searchbar">${ic('search',17)}<input class="in" id="pq" placeholder="Search name, phone, address…" value="${esc(q)}"></div>
  <div class="card"><div class="list">${list.length?list.map(p=>{const[bl,bc]=balLabel(p.id);
   return `<div class="lrow" data-id="${p.id}"><span class="avatar">${initialsOf(p.name)}</span>
   <div class="lmain"><div class="lname">${esc(p.name)} ${blockedListBadge(p)}</div>
   <div class="lsub"><span>${esc(p.phone||'—')}</span><span>·</span><span>${partyKindOf(p)==='supplier'?'Supplier':'Customer'}</span>${p.address?`<span>·</span><span>${esc(p.address)}</span>`:''}</div></div>
   <div class="lright"><div class="lamt" style="color:${bc==='b-red'?'var(--red)':bc==='b-green'?'var(--green)':'var(--ink2)'}">${money(Math.abs(partyBalance(p.id)))}</div><div class="lmeta">${bl.replace(money(Math.abs(partyBalance(p.id))),'').trim()||'net'}</div></div></div>`}).join(''):`<div class="empty">${ic('users',34)}<div class="big">No parties yet</div>Add your first customer or supplier.<div style="margin-top:14px"><button class="btn btn-primary" id="pNew2">${ic('plus',15)}New party</button></div></div>`}</div></div>`;
  $('#pNew').onclick=()=>go('parties/new');const n2=$('#pNew2');if(n2)n2.onclick=()=>go('parties/new');
  qsa('[data-ptf]').forEach(b=>b.onclick=()=>{tf=b.dataset.ptf;draw()});
  const si=$('#pq');si.oninput=e=>{q=e.target.value.toLowerCase();const pos=e.target.selectionStart;draw();const n=$('#pq');n.focus();n.setSelectionRange(pos,pos)};
  qsa('.lrow[data-id]').forEach(r=>r.onclick=()=>go('parties/'+r.dataset.id))};
 draw()}

function vPartyDetail(pid){const p=partyById(pid);
 if(!p){V().innerHTML='<div class="card"><div class="empty">Party not found.</div></div>';return}
 const cust=S.me.role==='customer';
 setTop(p.name,'parties');setActiveNav('parties');
 const es=partyEntries(pid);let run=0;
 const rows=es.map(e=>{run+=(e.dr||0)-(e.cr||0);
  return `<div class="lgrow${e.memo?' muted':''}"${e.link?` data-h="${e.link}"`:''} style="${e.link?'cursor:pointer':''}">
   <span class="ld"><b>${esc(e.desc)}</b><span>${fmtDate(e.date)}${e.ref?' · '+esc(e.ref):''}</span></span>
   <span class="num">${e.dr?money(e.dr):''}</span><span class="num">${e.cr?money(e.cr):''}</span>
   <span class="num" style="font-weight:600;color:${run>0.004?'var(--red)':run<-0.004?'var(--green)':'inherit'}">${money(Math.abs(run))}${run>0.004?' ↑':run<-0.004?' ↓':''}</span></div>`}).join('');
 const salesT=sum(SALES().filter(d=>d.partyId===pid),d=>d.total);
 const purT=sum(PURCHASES().filter(d=>d.partyId===pid),d=>d.total);
 const bal=partyBalance(pid);
 const newSaleBtn=(!cust&&partyKindOf(p)!=='supplier')?`<a class="btn btn-primary btn-sm" href="#/sales/new" onclick="sessionStorage.setItem('munshi_forceParty','${p.id}')">${ic('bag',15)}New invoice</a>`:'';
 V().innerHTML=`<div class="pagehead"><div><span class="lbl">${partyKindOf(p)==='supplier'?'Supplier':'Customer'}${p.phone?' · '+esc(p.phone):''}</span>
  <div class="ptitle" style="display:flex;align-items:center;gap:10px">${esc(p.name)} ${blockedListBadge(p)}</div>
  <div class="psub">${p.address?esc(p.address)+' · ':''}${p.gstin?'GSTIN '+esc(p.gstin):''}</div></div>
  ${cust?'':`<div style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn btn-ghost btn-sm" href="#/parties/edit/${p.id}">${ic('edit',15)}Edit</a>${partyBlockButton(pid)}${newSaleBtn}</div>`}</div>
 ${blockedBanner(pid)}
 ${ledgerActionButtons(pid)}
 <div class="sumrow">${sumTile('Balance',money(Math.abs(bal))+(bal>0.004?' due':bal<-0.004?' adv':''),bal>0.004?'var(--red)':bal<-0.004?'var(--green)':null)}
  ${partyKindOf(p)==='supplier'?sumTile('Purchased',money(purT)):sumTile('Invoiced',money(salesT))}
  ${sumTile('Entries',String(es.length))}</div>
 <div class="card"><div class="cardhead"><span class="lbl">Ledger — full history</span><span class="lmeta">↑ due to us · ↓ we owe</span></div>
  <div class="cardpad">${rows||emptyHtml('book','No entries yet — invoices, returns and cash will appear here')}</div></div>`;
 qsa('.lgrow[data-h]').forEach(r=>r.onclick=()=>go(r.dataset.h))}

function vPartyForm(editId){const editing=editId?partyById(editId):null;

 V().innerHTML=`<div class="pagehead"><div><div class="ptitle">${editing?'Edit party':'New party'}</div><div class="psub">${editing?'Update details and opening balance':'Customer or supplier master record'}</div></div></div>
 <div class="card cardpad">
  <div class="field"><label class="fl">Party name *</label><input id="pfName" class="in" value="${esc(ob.name)}" placeholder="e.g. Sharma Mobile Center"></div>
  <div class="frow">
   <div class="field"><label class="fl">Phone</label><input id="pfPhone" class="in" inputmode="numeric" value="${esc(ob.phone||'')}" placeholder="10-digit mobile"></div>
   <div class="field"><label class="fl">Type</label><select id="pfType" class="sel">
    <option value="customer" ${ob.type!=='supplier'?'selected':''}>Customer</option>
    <option value="supplier" ${ob.type==='supplier'?'selected':''}>Supplier</option></select></div>
  </div>
  <div class="field"><label class="fl">Address</label><input id="pfAddr" class="in" value="${esc(ob.address||'')}"></div>
  <div class="field"><label class="fl">GSTIN (optional)</label><input id="pfGstin" class="in" value="${esc(ob.gstin||'')}"></div>

   <div class="frow" style="grid-template-columns:1fr 1fr">
    <div class="field"><label class="fl">Opening balance</label><input id="pfOB" class="in" type="number" step="0.01" min="0" value="${ob.openingBalance||''}" placeholder="0.00"></div>
    <div class="field"><label class="fl">Balance type</label><select id="pfOBT" class="sel">
     <option value="dr" ${ob.openingType!=='cr'?'selected':''}>Party owes us (Debit)</option>
     <option value="cr" ${ob.openingType==='cr'?'selected':''}>We owe party (Credit)</option></select></div>
   </div>
   <div class="field"><label class="fl">Opening date</label><input id="pfOBD" class="in" type="date" value="${ob.openingDate||todayISO()}"></div>
  </div>
  <div class="savebar"><button class="btn btn-ghost" id="pfCancel">Cancel</button><button class="btn btn-primary" id="pfSave">${ic('check',16)}Save party</button></div>
 </div>`;
 $('#pfCancel').onclick=()=>history.back();
 $('#pfSave').onclick=()=>{const name=($('#pfName').value||'').trim();
  if(!name)return toast('Party name is required','err');
  let phone=($('#pfPhone').value||'').replace(/\D/g,'');
  if(phone&&!validMobile(phone))return toast('Phone must be a 10-digit mobile number','err');
  const doc={name,phone,type:$('#pfType').value,address:($('#pfAddr').value||'').trim(),
   gstin:($('#pfGstin').value||'').trim().toUpperCase(),
   openingBalance:+($('#pfOB').value||0),openingType:$('#pfOBT').value,openingDate:$('#pfOBD').value||todayISO(),active:true};
  if(editing){dbUpdate('parties',editing.id,doc);toast('Party updated')}
  else{dbAdd('parties',doc);toast('Party added')}
  go('parties')}}

/* ================= CASH BOOK — Receipts & Payments ================= */
function vCash(kind){const isRec=kind==='receipts';
 setTop(isRec?'Receipts':'Payments');setActiveNav(kind);
 S.report['cash_'+kind]=S.report['cash_'+kind]||{month:todayISO().slice(0,7)};
 let month=S.report['cash_'+kind].month;
 const src=(isRec?RECEIPTS():PAYMENTS()).slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.created||0)-(a.created||0));
 const draw=()=>{
  const rows=src.filter(r=>(r.date||'').slice(0,7)===month);
  const total=sum(rows,r=>r.amount);
  const modes={};rows.forEach(r=>{const m=(r.mode||'Cash');modes[m]=(modes[m]||0)+(+r.amount||0)});
  const modeRows=Object.entries(modes).sort((a,b)=>b[1]-a[1]);
  V().innerHTML=`<div class="pagehead"><div><div class="ptitle">${isRec?'Receipts':'Payments'}</div><div class="psub">${isRec?'Cash collected from customers':'Cash paid to suppliers'}</div></div>
   <button class="btn btn-primary btn-sm" id="cNew">${ic('plus',15)}${isRec?'New receipt':'New payment'}</button></div>
  <div class="sumrow">${sumTile(isRec?'Collected this month':'Paid this month',money(total),isRec?'var(--green)':'var(--red)')}${sumTile('Entries',String(rows.length))}</div>
  <div class="card cardpad" style="margin-bottom:14px"><label class="fl">Month</label><input type="month" class="in" id="cMonth" value="${month}" style="max-width:200px">
   ${modeRows.length?`<div style="margin-top:10px">${modeRows.map(([m,v])=>barRow(m,((v/total)*100).toFixed(0)+'% of total',v,total,isRec?'var(--green)':'var(--red)')).join('')}</div>`:''}</div>
  <div class="card"><div class="list">${rows.length?rows.map(r=>{const p=partyById(r.partyId);
   return `<div class="lrow editmode"><span class="avatar" style="background:${isRec?'var(--green-soft)':'var(--red-soft)'};color:${isRec?'var(--green)':'var(--red)'}">${ic(isRec?'down':'up',16)}</span>
   <div class="lmain"><div class="lname">${esc(p?p.name:'—')}</div><div class="lsub"><span>${fmtDate(r.date)}</span><span>·</span><span>${esc(r.mode||'Cash')}</span>${r.no?`<span>·</span><span class="mono">${esc(r.no)}</span>`:''}${r.note?`<span>·</span><span>${esc(r.note)}</span>`:''}</div></div>
   <div class="lright"><div class="lamt" style="color:${isRec?'var(--green)':'var(--red)'}">${money(r.amount)}</div>
   ${isMgr()?`<button class="icon-btn" data-del="${r.id}" style="margin-top:6px;color:var(--red)">${ic('trash',14)}</button>`:''}</div></div>`}).join(''):`<div class="empty">${ic('wallet',34)}<div class="big">No ${isRec?'receipts':'payments'} this month</div>Use the ${isRec?'Receive':'Pay'} button on any party ledger, or add one here.</div>`}</div></div>`;
  $('#cNew').onclick=()=>go(kind+'/new');
  $('#cMonth').onchange=e=>{month=e.target.value||month;S.report['cash_'+kind].month=month;draw()};
  qsa('[data-del]').forEach(b=>b.onclick=e=>{e.stopPropagation();
   confirmBox('Delete this entry?','The ledger balance of the party will change immediately.',()=>{dbDel(kind,isRec?b.dataset.del:b.dataset.del);toast('Entry deleted');route()},'Delete')})};
 draw()}

function vCashForm(kind){const isRec=kind==='receipts';
 setTop(isRec?'New receipt':'New payment',kind);setActiveNav(kind);
 const pool=PARTIES().filter(p=>isRec?partyKindOf(p)!=='supplier':partyKindOf(p)==='supplier')

 V().innerHTML=`<div class="pagehead"><div><div class="ptitle">${isRec?'Receive payment':'Make payment'}</div><div class="psub">${isRec?'Money in from a customer':'Money out to a supplier'}</div></div></div>
 <div class="card cardpad">
  <div class="field"><label class="fl">${isRec?'From party':'To party'} *</label>
   <select id="cfParty" class="sel">${pool.length?pool.map(p=>`<option value="${p.id}">${esc(p.name)}${p.phone?' · '+esc(p.phone):''}</option>`).join(''):'<option value="">No eligible party</option>'}</select></div>
  <div class="frow">
   <div class="field"><label class="fl">Amount *</label><input id="cfAmt" class="in" type="number" min="0.01" step="0.01" placeholder="0.00"></div>
   <div class="field"><label class="fl">Date</label><input id="cfDate" class="in" type="date" value="${todayISO()}"></div>
  </div>
  <div class="field"><label class="fl">Mode</label><select id="cfMode" class="sel"><option>Cash</option><option>Bank Transfer</option><option>UPI</option><option>Cheque</option><option>Other</option></select></div>
  <div class="field"><label class="fl">Note (optional)</label><input id="cfNote" class="in" maxlength="120" placeholder="reference / remark"></div>

  toast((isRec?'Receipt ':'Payment ')+no+' saved');go(kind)}}
/* ================= DOCUMENT LISTS ================= */
function vDocs(kind){const d=DOC[kind];
 setTop(d.title+'s');setActiveNav(kind.startsWith('sale')&&kind!=='sales'?kind:d.path||kind);
 S.report['docs_'+kind]=S.report['docs_'+kind]||{month:todayISO().slice(0,7)};
 let month=S.report['docs_'+kind].month,q='';
 const all=()=>state[d.coll].slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.created||0)-(a.created||0));
 const draw=()=>{
  const rows=all().filter(x=>(x.date||'').slice(0,7)===month)
   .filter(x=>!q||((x.no||'')+' '+(partyById(x.partyId)?.name||'')).toLowerCase().includes(q));
  const total=sum(rows,x=>x.total),paid=sum(rows,x=>+x.paid||0);
  const isSale=kind==='sale',isRet=d.isReturn;
  V().innerHTML=`<div class="pagehead"><div><div class="ptitle">${d.title}s</div><div class="psub">${isSale?'Billed to customers':isRet?'Goods returned':'Received from suppliers'}</div></div>
   <button class="btn btn-primary btn-sm" id="dNew">${ic('plus',15)}New</button></div>
  <div class="sumrow">${sumTile('Total this month',money(total),isSale?'var(--green)':isRet?'var(--amber)':'var(--red)')}
   ${isRet?sumTile('Entries',String(rows.length)):sumTile(isSale?'Received':'Paid',money(paid))}
   ${isRet?'':sumTile('Outstanding',money(total-paid),total-paid>0.004?'var(--red)':'var(--green)')}
   <div class="sum" style="display:flex;align-items:flex-end"><div style="flex:1"><label class="fl">Month</label><input type="month" class="in" id="dMonth" value="${month}" style="padding:7px 9px"></div></div></div>
  <div class="searchbar">${ic('search',17)}<input class="in" id="dq" placeholder="Search invoice no. or party…" value="${esc(q)}"></div>
  <div class="card"><div class="list">${rows.length?rows.map(x=>{const p=partyById(x.partyId);
   const[bl,bc]=balLabel(x.partyId);
   return `<div class="lrow" data-id="${x.id}"><div class="lmain"><div class="lname"><span class="mono" style="font-size:13px">${esc(x.no||'—')}</span><span>${esc(p?p.name:'—')}</span></div>
   <div class="lsub"><span>${fmtDate(x.date)}</span><span>·</span><span>${LINES(x).length} item${LINES(x).length!==1?'s':''}</span>${isRet?`<span>·</span><span>${x.settle==='cash'?'cash settled':'credit note'}</span>`:x.no?`<span>·</span><span>${bl}</span>`:''}</div></div>
   <div class="lright"><div class="lamt">${money(x.total)}</div><div class="lmeta">${isRet?'':(x.total-((+x.paid)||0))>0.004?'bal '+money(x.total-((+x.paid)||0)):'fully paid'}</div></div></div>`}).join(''):
   `<div class="empty">${ic('bag',34)}<div class="big">No ${d.title}s this month</div>${isSale?'Create your first invoice.':''}<div style="margin-top:14px"><button class="btn btn-primary" id="dNew2">${ic('plus',15)}New ${d.one}</button></div></div>`}</div></div>`;
  $('#dNew').onclick=()=>go(d.path+'/new');const n2=$('#dNew2');if(n2)n2.onclick=()=>go(d.path+'/new');
  $('#dMonth').onchange=e=>{month=e.target.value||month;S.report['docs_'+kind].month=month;draw()};
  const si=$('#dq');si.oninput=e=>{q=e.target.value.toLowerCase();const pos=e.target.selectionStart;draw();const n=$('#dq');n.focus();n.setSelectionRange(pos,pos)};
  qsa('.lrow[data-id]').forEach(r=>r.onclick=()=>go(d.path+'/view/'+r.dataset.id))};
 draw()}

/* ================= DOCUMENT FORM ================= */
function vDocForm(kind,editId){const d=DOC[kind],editing=editId?dbGet(d.coll,editId):null;
 setTop(editing?'Edit '+d.one:'New '+d.one,d.path);setActiveNav(d.path);
 /* Billing-block guard — sale invoices to a blocked party are refused right at the form */
 if(kind==='sale'&&!editing&&S.draftOrder){/* order flow checked below */}
 let lines=editing?LINES(editing).map(l=>({itemId:l.itemId,qty:+l.qty||0,rate:+l.rate||0})):[];
 let partyId=editing?editing.partyId:'',discount=editing?(+editing.discount||0):0;
 /* Order→invoice draft: prefill from the online order being invoiced */
 let fromOrder=null;
 if(!editing&&kind==='sale'&&S.draftOrder){fromOrder=dbGet('orders',S.draftOrder);
  if(fromOrder){lines=LINES(fromOrder).map(l=>({itemId:l.itemId,qty:+l.qty||0,rate:+l.rate||0}));
   partyId=fromOrder.partyId||''}}
 /* Party pre-selected from a ledger "New invoice" button */
 if(!editing){const fp=sessionStorage.getItem('munshi_forceParty');if(fp){partyId=fp;sessionStorage.removeItem('munshi_forceParty')}}
 const pool=PARTIES().filter(p=>partyKindOf(p)===(d.partyKind==='supplier'?'supplier':'customer')).sort((a,b)=>(a.name||'').localeCompare(b.name||''));
 const rateOf=it=>+(it?it[d.rateKey]||it.saleRate||0:0);
 const draw=()=>{
  const sub=sum(lines,l=>l.qty*l.rate),total=Math.max(0,sub-discount);
  const p=partyId?partyById(partyId):null;
  const blocked=p&&kind==='sale'&&p.billingBlocked;
  V().innerHTML=`<div class="pagehead"><div><div class="ptitle">${editing?'Edit':'New'} ${d.title}</div>
   <div class="psub">${editing?('No. '+esc(editing.no||'')):('No. will be '+nextPreview(d.no))}</div></div></div>
  ${blocked?blockedBanner(partyId):''}
  ${fromOrder?`<div class="notice green">${ic('check',15)}<div>Pre-filled from online order <b>${esc(fromOrder.no)}</b> — it will be marked Invoiced when you save.</div></div>`:''}
  <div class="card cardpad">
   <div class="field"><label class="fl">${d.partyKind==='supplier'?'Supplier':'Customer'} *</label>
    <select id="dfParty" class="sel" ${blocked?'style="border-color:var(--red)"':''}>
     <option value="">— Select —</option>
     ${pool.map(x=>`<option value="${x.id}" ${partyId===x.id?'selected':''}>${esc(x.name)}${x.phone?' · '+esc(x.phone):''}${x.billingBlocked?' ⛔ BLOCKED':''}</option>`).join('')}</select></div>
   <div class="field"><label class="fl">Date</label><input id="dfDate" class="in" type="date" value="${editing?editing.date:todayISO()}" style="max-width:220px"></div>
   <div style="border-top:1px dashed var(--line);margin:4px 0 10px;padding-top:12px">
    <div class="fline" style="border-bottom:0;padding:0 0 6px"><div class="fl-item"><label class="fl">Add item — search name or SKU</label><div class="combowrap"><input id="dfSearch" class="in" placeholder="Type to search items…" autocomplete="off"></div></div></div>
    <div id="dfLines">${lines.length?lines.map((l,i)=>{const it=itemById(l.itemId);const so=it?stockOf(it.id):0;
     return `<div class="fline"><div class="fl-item"><div class="ldwrap">${itemThumb(it,34)}<div class="ldtxt"><b>${esc(it?it.name:'?')}</b>
      <span class="lsub">${kind==='sale'?`stock ${so}${l.qty>so?' — <span style="color:var(--red)">selling more than stock</span>':''}`:esc(brandById(it?.brandId)?.name||'')}</span></div></div></div>
      <input class="in fl-qty" type="number" min="0.01" step="1" data-lq="${i}" value="${l.qty}">
      <input class="in fl-rate" type="number" min="0" step="0.01" data-lr="${i}" value="${l.rate}">
      <span class="fl-amt">${money(l.qty*l.rate)}</span>
      <button class="icon-btn fl-del" data-ld="${i}" style="color:var(--red)">${ic('trash',15)}</button></div>`}).join(''):
     `<div class="muted" style="font-size:13px;padding:6px 0 2px">No items yet — search above to add.</div>`}</div>
   </div>
   ${d.isReturn?`<div class="field"><label class="fl">Settle as</label><div class="seg">
     <label class="sego"><input type="radio" name="settle" value="credit" ${(!editing||editing.settle==='credit')?'checked':''}><span>Credit note (adjust balance)</span></label>
     <label class="sego"><input type="radio" name="settle" value="cash" ${(editing&&editing.settle==='cash')?'checked':''}><span>${kind==='saleReturn'?'Refund cash now':'Cash back now'}</span></label></div></div>
    <div class="field"><label class="sego" style="display:inline-flex"><input type="checkbox" id="dfGoods" ${!editing||editing.goodsBack!==false?'checked':''} style="width:18px;height:18px;margin-right:8px"><span style="border:0;padding:0;background:none;color:var(--ink);font-weight:600">Goods physically returned to stock</span></label></div>`
   :`<div class="frow">
     <div class="field"><label class="fl">Discount (whole bill)</label><input id="dfDisc" class="in" type="number" min="0" step="0.01" value="${discount||''}" placeholder="0.00"></div>
     <div class="field"><label class="fl">${d.paidLabel}</label><input id="dfPaid" class="in" type="number" min="0" step="0.01" value="${editing?(+editing.paid||0):''}" placeholder="0.00"></div></div>
    <div class="field"><label class="fl">Payment mode</label><select id="dfMode" class="sel"><option>Cash</option><option>Bank Transfer</option><option>UPI</option><option>Cheque</option><option>Credit</option></select></div>`}
   <div style="border-top:2px solid var(--ink);margin-top:8px;padding-top:10px">
    <div class="trow"><span>Subtotal</span><b>${money(sub)}</b></div>
    ${d.isReturn?'':`<div class="trow"><span>Discount</span><b>− ${money(discount)}</b></div>`}
    <div class="trow grand"><span>${d.isReturn?'Return value':'Total'}</span><b style="font-size:18px">${money(total)}</b></div>
   </div>
   <div class="savebar"><button class="btn btn-ghost" id="dfCancel">Cancel</button>
    <button class="btn btn-primary" id="dfSave" ${blocked?'style="opacity:.5"':''}>${ic('check',16)}${editing?'Update':'Save'} ${d.one}</button></div>
  </div>`;
  /* party change — re-check block */
  $('#dfParty').onchange=e=>{partyId=e.target.value;const np=partyId?partyById(partyId):null;
   if(np&&kind==='sale'&&np.billingBlocked){toast('Billing is blocked for '+np.name+' — only an admin can reactivate','err')}
   draw()};
  /* item search combo */
  const searchIn=$('#dfSearch');
  attachCombo(searchIn,{getPool:()=>ITEMS().map(it=>({id:it.id,label:it.name||'Item',sub:(brandById(it.brandId)?.name||'')+(it.sku?' · '+it.sku:'')+' · '+money(rateOf(it))+(kind==='sale'?' · stock '+stockOf(it.id):'')})),
   onPick:o=>{const it=itemById(o.id);if(!it)return;
    const ex=lines.find(l=>l.itemId===it.id);
    if(ex)ex.qty+=1;else lines.push({itemId:it.id,qty:1,rate:rateOf(it)});
    draw();const n=$('#dfSearch');if(n){n.focus()}}});
  qsa('[data-lq]').forEach(i=>i.oninput=e=>{lines[+i.dataset.lq].qty=+e.target.value||0;recalcOnly()});
  qsa('[data-lr]').forEach(i=>i.oninput=e=>{lines[+i.dataset.lr].rate=+e.target.value||0;recalcOnly()});
  qsa('[data-ld]').forEach(b=>b.onclick=()=>{lines.splice(+b.dataset.ld,1);draw()});
  function recalcOnly(){/* light refresh of amounts without losing focus */
   const sub2=sum(lines,l=>l.qty*l.rate);const disc=+(($('#dfDisc')||{}).value||discount)||0;
   const rows=qsa('#dfLines .fline');rows.forEach((r,i)=>{const l=lines[i];if(!l)return;
    const amt=r.querySelector('.fl-amt');if(amt)amt.textContent=money(l.qty*l.rate)});
   const gr=qsa('.trow b');/* full totals refresh on blur only to keep typing smooth */
  }
  qsa('[data-lq],[data-lr]').forEach(i=>i.onchange=()=>draw());
  const dd=$('#dfDisc');if(dd)dd.onchange=e=>{discount=+e.target.value||0;draw()};
  $('#dfCancel').onclick=()=>{S.draftOrder=null;history.back()};
  $('#dfSave').onclick=async()=>{
   const pid=$('#dfParty').value;
   if(!pid)return toast('Select a party','err');
   /* HARD GUARD: blocked party → no sale invoice */
   if(kind==='sale'){const pp=partyById(pid);
    if(pp&&pp.billingBlocked)return toast('Billing is blocked for '+pp.name+' — invoice not saved','err')}
   const clean=lines.filter(l=>l.itemId&&l.qty>0);
   if(!clean.length)return toast('Add at least one item with quantity','err');
   const sub2=sum(clean,l=>l.qty*l.rate);
   const doc={partyId:pid,date:$('#dfDate').value||todayISO(),lines:clean,subtotal:+sub2.toFixed(2),total:0,created:editing?editing.created:Date.now()};
   if(d.isReturn){doc.settle=qsa('input[name=settle]').find(r=>r.checked).value;
    doc.goodsBack=$('#dfGoods').checked;doc.total=+sub2.toFixed(2);
    if(doc.settle==='cash')doc.cashAmount=+sub2.toFixed(2)}
   else{const disc=Math.min(discount,sub2);doc.discount=+disc.toFixed(2);
    doc.total=+(sub2-disc).toFixed(2);
    let paid=+(($('#dfPaid')||{}).value||0);if(!(paid>0))paid=0;
    if(paid>doc.total)paid=doc.total;
    doc.paid=+paid.toFixed(2);doc.payMode=$('#dfMode')?$('#dfMode').value:'Cash'}
   if(editing){dbUpdate(d.coll,editing.id,doc);toast(d.one+' updated');S.draftOrder=null;go(d.path+'/view/'+editing.id);return}
   doc.no=await nextNo(d.no);
   const saved=dbAdd(d.coll,doc);
   if(!saved)return;/* blocked — dbAdd already toasted */
   /* mark originating online order as invoiced */
   if(fromOrder){dbUpdate('orders',fromOrder.id,{status:'invoiced',invoiceId:saved.id,
    history:[...(fromOrder.history||[]),{ts:Date.now(),status:'invoiced',by:S.me.name+' (invoice '+doc.no+')'}]});
    S.draftOrder=null;updateBadges()}
   toast(d.one+' '+doc.no+' saved');go(d.path+'/view/'+saved.id)};
 };
 draw()}

/* ================= DOCUMENT VIEW + PRINT ================= */
function vDocView(kind,id){const d=DOC[kind],x=dbGet(d.coll,id);
 if(!x){V().innerHTML='<div class="card"><div class="empty">Document not found.</div></div>';return}
 setTop(d.one+' '+(x.no||''),d.path);setActiveNav(d.path);
 const p=partyById(x.partyId);
 const sub=docSub(x),disc=+x.discount||0,total=+x.total||0,paid=+x.paid||0;
 const bal=Math.max(0,total-paid);
 const lines=LINES(x).map(l=>{const it=itemById(l.itemId);
  return `<div class="lgrow"><span class="ld"><span class="ldwrap">${itemThumb(it,34)}<span class="ldtxt"><b>${esc(it?it.name:'?')}</b>

function vStock(){setTop('Stock');setActiveNav('stock');
 if(!can.stockEdit(S.me)){V().innerHTML='<div class="card"><div class="empty">Stock editing is admin-only; you can view values on the Dashboard.</div></div>';return}
 const st=S.report.stock=S.report.stock||{basis:'cost',tab:'category'};
 const draw=()=>{
  const rows=stockRows();
  const costV=sum(rows,r=>r.value), saleV=sum(rows,r=>r.qty*(+(r.it.saleRate||0)));
  const low=rows.filter(r=>r.qty>0&&r.qty<=5).length, out=rows.filter(r=>r.qty<=0).length;
  const basis=st.basis;
  let body='';const tab=st.tab;
  if(tab==='item'){
   body=rows.length?rows.map(r=>`<div class="brow"><div><span class="bname">${esc(r.it.name||'—')}</span><span class="bsub">${esc(brandById(r.it.brandId)?.name||'No brand')} · ${esc(catFullName(r.it.categoryId))}</span></div><div class="btrack"><i style="width:${Math.min(100,Math.max(2,r.qty/Math.max(1,...rows.map(x=>x.qty))*100))}%;background:var(--green)"></i></div><div class="bv">${r.qty} · ${money(basis==='cost'?r.value:r.qty*(+(r.it.saleRate||0)))}</div></div>`).join(''):emptyHtml('box','No items yet')}
  else if(tab==='category'){
   const tops=CATS_TOP(),buckets=[];
   tops.forEach(t=>{const own=rows.filter(r=>r.it.categoryId===t.id);
    const subs=SUBCATS(t.id).map(s=>({s,rows:rows.filter(r=>r.it.categoryId===s.id)}));
    const allc=own.concat(subs.flatMap(x=>x.rows));
    buckets.push({t,own,subs,total:sum(allc,r=>basis==='cost'?r.value:r.qty*(+(r.it.saleRate||0)))})});
   const un=rows.filter(r=>!r.it.categoryId);
   if(un.length)buckets.push({t:null,own:un,subs:[],total:sum(un,r=>basis==='cost'?r.value:r.qty*(+(r.it.saleRate||0)))});
   const mx=Math.max(1,...buckets.map(b=>b.total));
   body=buckets.length?buckets.sort((a,b)=>b.total-a.total).map(b=>{
    const name=b.t?b.t.name:'Unassigned';
    let html=`<div class="brow"><div><span class="bname">${esc(name)}</span><span class="bsub">${b.own.length} direct item(s) · ${b.subs.length} sub-categor${b.subs.length===1?'y':'ies'}</span></div><div class="btrack"><i style="width:${b.total/mx*100}%;background:var(--green)"></i></div><div class="bv">${money(b.total)}</div></div>`;
    b.subs.filter(x=>x.rows.length).forEach(x=>{const sv=sum(x.rows,r=>basis==='cost'?r.value:r.qty*(+(r.it.saleRate||0)));
     html+=`<div class="brow"><div><span class="bname" style="padding-left:16px">↳ ${esc(x.s.name)}</span><span class="bsub">sub-category</span></div><div class="btrack"><i style="width:${sv/mx*100}%;background:#7FA98E"></i></div><div class="bv">${money(sv)}</div></div>`});
    return html}).join(''):emptyHtml('layers','No categories with items')}
  else{
   const g=groupBy(rows.filter(r=>r.it.brandId),r=>r.it.brandId);
   const un=rows.filter(r=>!r.it.brandId);
   const arr=Object.keys(g).map(k=>({name:brandById(k)?.name||'—',rows:g[k]}));
   if(un.length)arr.push({name:'Unassigned',rows:un});
   const vals=arr.map(a=>sum(a.rows,r=>basis==='cost'?r.value:r.qty*(+(r.it.saleRate||0))));
   const mx=Math.max(1,...vals);

function vStockAdj(){setTop('Adjust stock','stock');setActiveNav('stock');

    <div id="ajPick" style="margin-top:8px"></div></div>
   <div class="frow">
    <div class="field"><label class="fl">Change (+ add / − remove) *</label><input id="ajDelta" class="in" type="number" step="1" placeholder="e.g. -2 or 5"></div>
    <div class="field"><label class="fl">Unit cost (if adding stock)</label><input id="ajRate" class="in" type="number" min="0" step="0.01" placeholder="optional"></div>
   </div>
   <div class="field"><label class="fl">Reason / note</label><input id="ajNote" class="in" maxlength="120" placeholder="e.g. damaged in transit"></div>
   ${pick?`<div class="notice green">${ic('check',15)}<div>${esc(pick.name)} — current stock <b>${stockOf(pick.id)}</b> → after change <b>${stockOf(pick.id)+ (+($('#ajDelta')?.value||0))}</b></div></div>`:''}
   <div class="savebar"><button class="btn btn-ghost" id="ajCancel">Cancel</button><button class="btn btn-primary" id="ajSave">${ic('check',16)}Save adjustment</button></div>

  attachCombo($('#ajSearch'),{getPool:()=>ITEMS().map(it=>({id:it.id,label:it.name||'Item',sub:(brandById(it.brandId)?.name||'')+' · stock '+stockOf(it.id)})),

 draw()}

    ${stt[0]==='open'?`<button class="btn btn-ghost btn-sm" data-cp="${v.id}">${ic('edit',14)}Copy</button><button class="icon-btn" data-rv="${v.id}" style="color:var(--red)" title="Revoke">${ic('trash',15)}</button>`:stt[0]==='expired'?`<button class="icon-btn" data-rv="${v.id}" style="color:var(--red)">${ic('trash',15)}</button>`:''}</div>`}).join(''):`<div class="empty">${ic('tag',34)}<div class="big">No invite codes</div>Generate one and share it privately with your staff member.</div>`}</div></div>

function brandChecksHtml(sel){const selArr=Array.isArray(sel)?sel:[];
 return BRANDS().slice().sort((a,b)=>(a.name||'').localeCompare(b.name||'')).map(b=>
  `<label class="sego" style="margin:0 8px 8px 0"><input type="checkbox" data-bid="${b.id}" ${selArr.includes(b.id)?'checked':''}><span>${esc(b.name)}</span></label>`).join('')||'<p class="muted" style="font-size:13px">No brands exist yet — create brands first to restrict access.</p>'}
function collectBrandChecks(){return qsa('input[data-bid]').filter(i=>i.checked).map(i=>i.dataset.bid)}

function openAllocModal(userId){const t=dbGet('users',userId);if(!t)return;
 const cur=Array.isArray(t.allocatedBrands)?t.allocatedBrands:[];
 openModal(`<div class="mhead"><h3>Brand allocation — ${esc(t.name)}</h3><button class="icon-btn" onclick="closeModal()">${ic('x')}</button></div>
 <div class="mbody">
  <div class="notice"><div><b>${esc(t.role)}</b> · leave all unchecked to give access to <b>every brand</b>. Checked brands limit the catalog, invoices and reports to those brands only.</div></div>
  <div style="display:flex;flex-wrap:wrap;margin-top:6px">${brandChecksHtml(cur)}</div>
  <div style="margin-top:6px"><button class="btn btn-ghost btn-sm" id="alAll">Select all</button> <button class="btn btn-ghost btn-sm" id="alNone">Clear all</button></div>
 </div>
 <div class="mfoot"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" id="alSave">Save allocation</button></div>`);
 $('#alAll').onclick=()=>qsa('input[data-bid]').forEach(i=>i.checked=true);
 $('#alNone').onclick=()=>qsa('input[data-bid]').forEach(i=>i.checked=false);
 $('#alSave').onclick=()=>{const brands=collectBrandChecks();
  dbUpdate('users',t.id,{allocatedBrands:brands});
  closeModal();toast(brands.length?brands.length+' brand(s) allocated to '+t.name:'All brands — no restriction')}}

function openStaffForm(){openModal(`<div class="mhead"><h3>Add staff / admin</h3><button class="icon-btn" onclick="closeModal()">${ic('x')}</button></div>
 <div class="mbody">
  <div class="field"><label class="fl">Full name *</label><input id="sfName" class="in" placeholder="e.g. Rahul Sharma"></div>
  <div class="frow">
   <div class="field"><label class="fl">Mobile (login ID) *</label><input id="sfMob" class="in" inputmode="numeric" placeholder="10 digits" maxlength="10"></div>
   <div class="field"><label class="fl">Role</label><select id="sfRole" class="sel">

 <div class="mbody">

function vReportProfit(){setTop('Profit Analysis');setActiveNav('r/profit');S.report.profit=S.report.profit||{preset:'month',tab:'date',...mk(presetRange('month'))};
 const key='profit';const draw=()=>{const r=S.report[key],f=r.from,t=r.to;
  const ac={};const AC=id=>ac[id]||(ac[id]=avgCost(itemById(id)));
  const invs=SALES().filter(d=>inR(d.date,f,t)),rets=SRET().filter(d=>inR(d.date,f,t));
  let rev=0,cogs=0;const rows=[];
  const push=(k,net,cost)=>{let row=rows.find(x=>x.k===k);if(!row){row={k,rev:0,cogs:0};rows.push(row)}row.rev+=net;row.cogs+=cost};
  invs.forEach(d=>{const sub=docSub(d);LINES(d).forEach(l=>{const it=itemById(l.itemId);if(!it)return;
    const g=(+l.qty||0)*(+l.rate||0),net=g-((+d.discount||0)*(sub?g/sub:0)),c=(+l.qty||0)*AC(l.itemId);
    rev+=net;cogs+=c;
    push('d:'+d.date,net,c);push('i:'+l.itemId,net,c);
    push('c:'+(it.categoryId||'—'),net,c);
    push('s:'+(it.categoryId||'—'),net,c);
    push('b:'+(it.brandId||'—'),net,c);
    push('p:'+(d.partyId||'—'),net,c)})});
  rets.forEach(rt=>{LINES(rt).forEach(l=>{const it=itemById(l.itemId);if(!it)return;
    const net=(+l.qty||0)*(+l.rate||0),c=rt.goodsBack!==false?(+l.qty||0)*AC(l.itemId):0;
    rev-=net;cogs-=c;
    push('d:'+rt.date,-net,-c);push('i:'+l.itemId,-net,-c);
    push('c:'+(it.categoryId||'—'),-net,-c);
    push('s:'+(it.categoryId||'—'),-net,-c);
    push('b:'+(it.brandId||'—'),-net,-c);
    push('p:'+(rt.partyId||'—'),-net,-c)})});
  const profit=rev-cogs,margin=rev>0?profit/rev*100:0;
  const label=k=>k.startsWith('d:')?fmtDate(k.slice(2))
    :k.startsWith('i:')?(itemById(k.slice(2))?.name||'—')
    :k.startsWith('c:')?(catById(k.slice(2))?.name||'—')
    :k.startsWith('s:')?catFullName(k.slice(2))
    :k.startsWith('b:')?(brandById(k.slice(2))?.name||'Unassigned')
    :k.startsWith('p:')?(partyById(k.slice(2))?.name||'—'):'—';
  const kindNote=k=>k.startsWith('s:')?(isSubCat(k.slice(2))?'sub-category':'main category')
    :k.startsWith('b:')?'brand':k.startsWith('p:')?'party':'';
  let body='';const tab=r.tab,pre={date:'d:',item:'i:',category:'c:',subcategory:'s:',brand:'b:',party:'p:'}[tab];
  const arr=rows.filter(x=>x.k.startsWith(pre)).map(x=>Object.assign({},x,{pr:x.rev-x.cogs})).sort((a,b)=>b.pr-a.pr);
  const mx=Math.max(1,...arr.map(x=>Math.abs(x.pr)));
  body=arr.length?arr.map(x=>`<div class="brow"><div><span class="bname">${esc(label(x.k))}</span><span class="bsub">rev ${money(x.rev)} · cogs ${money(x.cogs)}${kindNote(x.k)?' · '+kindNote(x.k):''}</span></div><div class="btrack"><i style="width:${Math.abs(x.pr)/mx*100}%;background:${x.pr>=0?'var(--green)':'var(--red)'}"></i></div><div class="bv" style="color:${x.pr>=0?'var(--green)':'var(--red)'}">${money(x.pr)}</div></div>`).join(''):emptyHtml('chart','No sales in this period');
  V().innerHTML=`<div class="pagehead"><div><div class="ptitle">Profit Analysis</div><div class="psub">Gross margin on weighted-average cost · ${fmtDate(f)} → ${fmtDate(t)}</div></div></div>
  ${rangeBar(key)}
  <div class="sumrow">${sumTile('Net revenue',money(rev))}${sumTile('Cost of goods',money(cogs))}${sumTile('Gross profit',money(profit),profit>=0?'var(--green)':'var(--red)')}${sumTile('Margin',margin.toFixed(1)+'%',margin>=0?'var(--green)':'var(--red)')}</div>
  ${tabsHtml(key,r.tab,[['date','Date-wise'],['item','Item-wise'],['category','Category-wise'],['subcategory','Sub-category'],['brand','Brand-wise'],['party','Party-wise']])}
  <div class="card cardpad">${body}</div>
  <p class="muted" style="font-size:12px;margin-top:10px">Sub-category view rolls items up by their category level; brand and party views attribute each invoice line to its brand and customer. Credit-only returns reduce revenue without returning stock.</p>`;
  bindRange(key);bindTabs(key)};
 draw()}

   await auth.signInWithEmailAndPassword(email,pw);
   toast('Welcome to Munshi, '+name.split(' ')[0]+'!')
  }catch(e){toast('Setup failed: '+(e.code||e.message),'err')}}}

/* ================= BOOT ================= */
let bootPending=true;
(function boot(){
 firebase.initializeApp(FIREBASE_CONFIG);
 auth=firebase.auth();DB=firebase.firestore();
 bootScreen();
 auth.onAuthStateChanged(async u=>{
  S.unsubs.forEach(x=>{try{x()}catch(e){}});S.unsubs=[];
  if(!u){S.me=null;S.booting=false;
   try{
    const sd=await DB.collection('setup').doc('key').get();
    const anyU=await DB.collection('users').limit(1).get();
    if(!sd.exists&&anyU.empty){vSetup();return}
   }catch(e){/* rules may block anonymous reads — show login */}
   if(bootPending!==false){vLogin();bootPending=false}
   return}
  try{
   const doc=await DB.collection('users').doc(u.uid).get();
   if(!doc.exists){await auth.signOut();vLogin('No profile found for this login. Contact the admin.');return}
   const ud=doc.data();
   if(ud.active===false){await auth.signOut();vLogin('This account is deactivated. Contact the admin.');return}
   S.me=Object.assign({id:u.uid},ud);
   S.booting=false;bootPending=false;
   state.items=[];state.brands=[];
   renderShell();subscribeAll(S.me);route();
  }catch(e){S.booting=false;showFatal(e.message||String(e))}
 });
})();
</script>
</body>
