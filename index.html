<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F2A1F">
<title>Munshi — Mobile Accessories Distribution</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Spline+Sans+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{
  --paper:#F5F3EC; --card:#FFFFFF; --ink:#182420; --ink2:#646F68; --ink3:#9AA39C;
  --line:#E4E0D3; --line2:#D3CFBF;
  --green:#0C6B4A; --green-soft:#E3EFE7; --green-ink:#0F2A1F; --green-ink2:#16382A;
  --red:#B23B2A; --red-soft:#F6E7E2; --amber:#A9720E; --amber-soft:#F5EBD4; --gold:#D9A441;
  --mono:'Spline Sans Mono',ui-monospace,Menlo,monospace;
  --disp:'Bricolage Grotesque',system-ui,sans-serif;
  --r:12px; --sh:0 1px 2px rgba(24,36,32,.05),0 10px 28px -16px rgba(24,36,32,.18);
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font:400 15px/1.5 var(--disp)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:500 16px var(--disp);color:var(--ink)}
input[type=number]{-moz-appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.mono{font-family:var(--mono)}
.muted{color:var(--ink2)}
.lbl{font:600 10.5px/1.4 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}
svg.ic{flex:none;display:block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:10px;font:600 14px var(--disp);border:1px solid transparent;transition:.15s}
.btn-primary{background:var(--green-ink);color:#F2F5EF}
.btn-primary:active{transform:translateY(1px)}
.btn-ghost{border-color:var(--line2);background:#fff}
.btn-danger{background:var(--red);color:#fff}
.btn-sm{padding:7px 12px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.45;pointer-events:none}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--ink2)}
.in,.sel{width:100%;border:1px solid var(--line2);background:#fff;border-radius:10px;padding:11px 12px}
.in:focus,.sel:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
.field{margin-bottom:14px}
.fl{display:block;font:600 10.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);margin-bottom:6px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border:1px solid var(--line2);border-radius:999px;background:#fff;font:600 12.5px var(--disp);color:var(--ink2);white-space:nowrap}
.chip.on{background:var(--green-ink);border-color:var(--green-ink);color:#F2F5EF}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font:600 11px var(--mono);letter-spacing:.04em}
.b-green{background:var(--green-soft);color:var(--green)} .b-red{background:var(--red-soft);color:var(--red)}
.b-amber{background:var(--amber-soft);color:var(--amber)} .b-gray{background:#EDEBE2;color:var(--ink2)}
.nbadge{min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font:700 10px/17px var(--mono);text-align:center;padding:0 5px;display:inline-block}
.authwrap{min-height:100vh;display:grid;grid-template-columns:1fr}
.aleft{display:none;background:var(--green-ink);color:#EAF0EA;padding:44px;position:relative;overflow:hidden}
.aleft .aruled{margin-top:auto;border-top:1px solid rgba(233,240,234,.18);font:500 12px var(--mono);color:#9DB4A6}
.arow{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px dashed rgba(233,240,234,.14)}
.mark{width:46px;height:46px;border-radius:12px;background:var(--gold);display:flex;align-items:center;justify-content:center;font:800 22px var(--disp);color:var(--green-ink)}
.aright{display:flex;flex-direction:column;justify-content:center;padding:32px 22px;background:var(--paper)}
.aright .card{max-width:420px;width:100%;margin:0 auto}
@media(min-width:900px){.authwrap{grid-template-columns:46% 54%}.aleft{display:flex;flex-direction:column}}
.ruled-bg{background-image:repeating-linear-gradient(0deg,transparent 0 27px,rgba(233,240,234,.07) 27px 28px)}
.authlinks{display:flex;justify-content:space-between;gap:10px;margin-top:14px;font-size:12.5px;flex-wrap:wrap}
.authlinks a{color:var(--green);font-weight:600}
.side{display:none;position:fixed;inset:0 auto 0 0;width:238px;background:var(--green-ink);color:#DCE6DD;z-index:30;flex-direction:column;padding:20px 14px;overflow-y:auto}
.sbrand{display:flex;align-items:center;gap:11px;padding:4px 8px 18px;border-bottom:1px solid rgba(233,240,234,.14);margin-bottom:14px}
.sbrand .mark{width:36px;height:36px;font-size:17px;border-radius:10px}
.sbrand b{font:700 17px var(--disp);color:#F2F6F0;display:block;line-height:1.1}
.sbrand span{font:500 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:#8FA795}
.sgroup{margin:14px 0 6px;padding:0 10px;font:600 9.5px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:#7E9A8A}
.slink{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;font:500 13.5px var(--disp);color:#C3D2C5;margin:1px 0}
.slink:hover{background:rgba(255,255,255,.06)}
.slink.on{background:rgba(255,255,255,.1);color:#fff;box-shadow:inset 3px 0 0 var(--gold)}
.sfoot{margin-top:auto;padding:12px 8px 4px;border-top:1px solid rgba(233,240,234,.14);display:flex;align-items:center;gap:10px}
.sfoot .avatar{background:var(--gold);color:var(--green-ink)}
.avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 12px var(--disp);background:var(--green-soft);color:var(--green);flex:none}
.main{min-height:100vh;padding-bottom:76px}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;background:rgba(245,243,236,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar h1{font:600 19px/1.15 var(--disp);letter-spacing:-.01em}
.tleft{display:flex;align-items:center;gap:10px;min-width:0}
.tleft h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tright{display:flex;align-items:center;gap:10px}
.tdate{font:500 11.5px var(--mono);color:var(--ink2);display:none}
@media(min-width:640px){.tdate{display:block}}
.uchip{display:flex;align-items:center;gap:8px}
.uchip .uname{display:none;font:600 13px var(--disp)}
@media(min-width:640px){.uchip .uname{display:block}}
#topBack{display:none}
#topBack.show{display:inline-flex}
.view{padding:16px;max-width:1160px;margin:0 auto;animation:vin .28s ease}
@keyframes vin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.bnav{position:fixed;bottom:0;left:0;right:0;z-index:40;display:flex;background:#fff;border-top:1px solid var(--line);padding:6px 6px calc(7px + env(safe-area-inset-bottom))}
.bnav a,.bnav button{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font:600 10px var(--disp);color:var(--ink3);border-radius:10px}
.bnav a.on,.bnav button.on{color:var(--green)}
.bnav .nbadge{position:absolute;top:1px;right:calc(50% - 24px)}
@media(min-width:1024px){
  .side{display:flex}.bnav{display:none}
  .main{margin-left:238px;padding-bottom:24px}
  .view{padding:26px 30px}
}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.ptitle{font:700 26px/1.1 var(--disp);letter-spacing:-.02em}
.psub{color:var(--ink2);font-size:13.5px;margin-top:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.cardhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.cardpad{padding:16px}
.grid2{display:grid;gap:14px}
@media(min-width:1024px){.grid2{grid-template-columns:1fr 1fr}}
.searchbar{position:relative;margin-bottom:12px}
.searchbar .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink3)}
.searchbar .in{padding-left:38px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
@media(min-width:900px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;box-shadow:var(--sh)}
.kpiV{font:700 21px/1.2 var(--mono);letter-spacing:-.02em;margin-top:6px}
.kpiD{font:500 10.5px var(--mono);color:var(--ink2);margin-top:3px}
.tint-g .kpiV{color:var(--green)} .tint-r .kpiV{color:var(--red)}
.list{display:flex;flex-direction:column}
.lrow{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);cursor:pointer;background:#fff}
.lrow:last-child{border-bottom:0}
.lrow:active{background:var(--paper)}
.lrow.editmode{cursor:default}
.lmain{flex:1;min-width:0}
.lname{font:600 14.5px var(--disp);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lsub{font:500 12px var(--mono);color:var(--ink2);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap}
.lright{text-align:right;flex:none}
.lamt{font:700 14.5px var(--mono);letter-spacing:-.01em}
.lmeta{font:500 11px var(--mono);color:var(--ink2);margin-top:2px}
.empty{padding:44px 20px;text-align:center;color:var(--ink2)}
.empty .big{font:700 19px var(--disp);color:var(--ink);margin:10px 0 4px}
.empty svg{color:var(--line2)}
.brow{display:grid;grid-template-columns:minmax(90px,1.1fr) 2fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.brow:last-child{border-bottom:0}
.bname{font:600 13.5px var(--disp);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bsub{font:500 10.5px var(--mono);color:var(--ink2)}
.btrack{height:9px;background:#EFECE2;border-radius:99px;overflow:hidden}
.btrack i{display:block;height:100%;border-radius:99px}
.bv{font:600 13px var(--mono);text-align:right;white-space:nowrap}
.sumrow{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media(min-width:760px){.sumrow{grid-template-columns:repeat(4,1fr)}}
.sum{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:11px 13px}
.sum b{display:block;font:700 17px var(--mono);letter-spacing:-.02em;margin-top:4px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.rangebar{margin-bottom:14px}
.rdates{display:flex;align-items:center;gap:8px;margin-top:10px}
.rdates .in{padding:8px 10px;font-size:14px}
.fline{display:grid;gap:8px;grid-template-columns:1fr 74px 92px 34px;grid-template-areas:"item item item item" "qty rate amt del";align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.fline .fl-item{grid-area:item}.fline .fl-qty{grid-area:qty}.fline .fl-rate{grid-area:rate}
.fline .fl-amt{grid-area:amt;font:600 12.5px var(--mono);text-align:right;color:var(--ink2)}
.fline .fl-del{grid-area:del}
@media(min-width:860px){.fline{grid-template-columns:2.2fr 90px 110px 110px 34px;grid-template-areas:"item qty rate amt del"}}
.trow{display:flex;justify-content:space-between;padding:6px 0;font-size:14px}
.trow b{font-family:var(--mono)}
.grand{border-top:2px solid var(--ink);margin-top:8px;padding-top:10px;font-size:16px}
.notice{display:flex;gap:9px;align-items:flex-start;background:var(--amber-soft);border:1px solid #E8D9B4;color:#7A5A14;border-radius:10px;padding:10px 12px;font-size:13px;margin:10px 0}
.notice.red{background:var(--red-soft);border-color:#E7C9C0;color:#8C3423}
.notice.green{background:var(--green-soft);border-color:#CBDFD0;color:var(--green)}
.savebar{display:flex;gap:10px;margin-top:18px}
.savebar .btn{flex:1}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.sego{position:relative}
.sego input{position:absolute;opacity:0;pointer-events:none}
.sego span{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border:1px solid var(--line2);border-radius:10px;background:#fff;font:600 13px var(--disp);color:var(--ink2);cursor:pointer}
.sego input:checked+span{background:var(--green-ink);border-color:var(--green-ink);color:#F2F5EF}
.lgrow{display:grid;grid-template-columns:1fr 66px 66px 84px;gap:8px;align-items:baseline;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13px}
.lgrow:last-child{border-bottom:0}
.lgrow .ld{min-width:0}
.lgrow .ld b{display:block;font:600 13px var(--disp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lgrow .ld span{font:500 10.5px var(--mono);color:var(--ink3)}
.lgrow .num{font:500 12px var(--mono);text-align:right}
.lgrow.hdr{border-bottom:1px solid var(--line2);font:600 9.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);padding-bottom:6px}
@media(min-width:760px){.lgrow{grid-template-columns:1fr 90px 90px 110px}}
.feedrow{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px dashed var(--line);cursor:pointer}
.feedrow:last-child{border-bottom:0}
.ftype{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
.lowrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.lowrow:last-child{border-bottom:0}
.chartwrap{position:relative}
.chartwrap svg{display:block;width:100%}
.ctip{position:absolute;top:8px;transform:translateX(-50%);background:var(--green-ink);color:#EDF3EC;border-radius:9px;padding:8px 11px;font:500 11px/1.6 var(--mono);pointer-events:none;white-space:nowrap;display:none;box-shadow:var(--sh);z-index:5}
.ctip .tr{display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.legend{display:flex;gap:16px;align-items:center}
.legend span{display:flex;align-items:center;gap:6px;font:500 11.5px var(--mono);color:var(--ink2)}
.pgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:760px){.pgrid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1080px){.pgrid{grid-template-columns:repeat(4,1fr)}}
.pcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px;display:flex;flex-direction:column;gap:8px;cursor:pointer;box-shadow:var(--sh);transition:.15s}
.pcard:active{transform:scale(.98)}
.ptile{width:100%;height:74px;border-radius:10px;display:flex;align-items:center;justify-content:center;font:800 26px var(--disp)}
.pbrand{font:600 9.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.pname{font:600 13.5px/1.3 var(--disp);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:35px}
.pprice{font:700 15px var(--mono);letter-spacing:-.01em}
.prow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:#fff}
.stepper button{width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:var(--ink2)}
.stepper span{min-width:36px;text-align:center;font:600 14px var(--mono)}
.cartrow{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px dashed var(--line)}
.cartrow:last-child{border-bottom:0}
.mask{position:fixed;inset:0;background:rgba(16,26,21,.46);backdrop-filter:blur(2px);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease}
@media(min-width:760px){.mask{align-items:center}}
@keyframes fade{from{opacity:0}}
.modal{background:#fff;border-radius:18px 18px 0 0;width:100%;max-width:520px;max-height:88vh;overflow:auto;animation:up .22s ease}
@media(min-width:760px){.modal{border-radius:18px}}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2}
.mhead h3{font:700 17px var(--disp)}
.mbody{padding:18px}
.mfoot{display:flex;gap:10px;padding:14px 18px;border-top:1px solid var(--line)}
.mfoot .btn{flex:1}
.sheet{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:520px;max-height:84vh;overflow:auto;animation:up .22s ease;padding-bottom:env(safe-area-inset-bottom)}
.shhead{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 6px}
.shhead b{font:700 18px var(--disp)}
.shg{padding:12px 18px 2px}
.shg .lbl{display:block;margin-bottom:6px}
.shlink{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px dashed var(--line);font:600 14.5px var(--disp)}
.shlink .ic{color:var(--ink2)}
.shlink .chev{margin-left:auto;color:var(--ink3)}
#toastRoot{position:fixed;left:0;right:0;bottom:calc(86px + env(safe-area-inset-bottom));z-index:90;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{display:flex;align-items:center;gap:9px;background:var(--green-ink);color:#F0F4EE;padding:11px 18px;border-radius:12px;font:600 13.5px var(--disp);box-shadow:var(--sh);animation:up .2s ease}
.toast.err{background:var(--red)}
body.locked{overflow:hidden}
.onboard{background:var(--green-ink);color:#E9F0E9;border-radius:16px;padding:26px 22px;margin-bottom:16px;position:relative;overflow:hidden}
.onboard h2{font:700 24px/1.15 var(--disp);letter-spacing:-.02em;margin:8px 0 6px}
.onboard p{color:#AFC3B2;font-size:13.5px;max-width:520px}
.onboard .btns{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn-gold{background:var(--gold);color:var(--green-ink)}
.btn-outline-l{border:1px solid rgba(233,240,234,.3);color:#E9F0E9}
.livewrap{display:flex;align-items:center;gap:8px;font:500 11px var(--mono);color:var(--ink2)}
.livewrap i{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.pimg{position:relative;width:100%;height:112px;border-radius:10px;overflow:hidden;background:#EFECE2}
.pimg img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .45s cubic-bezier(.2,.7,.3,1)}
.pcard:hover .pimg img,.pcard:focus-within .pimg img{transform:scale(1.7)}
.pimg .phZ{position:absolute;right:8px;bottom:8px;background:rgba(15,42,31,.65);color:#fff;border-radius:8px;padding:3px 8px;font:600 10px var(--mono);opacity:0;transition:.25s;pointer-events:none;display:flex;align-items:center;gap:4px}
.pcard:hover .phZ{opacity:1}
.pimg.big{height:210px;cursor:zoom-in;margin-bottom:4px}
.pimg.big.zoomed{cursor:zoom-out}
.pimg.big.zoomed img{transform:scale(2)}
.imthumb{width:38px;height:38px;border-radius:9px;object-fit:cover;flex:none;background:#EFECE2}
.photopick{display:flex;gap:12px;align-items:center}
.photopick .pv{width:76px;height:76px;border-radius:12px;overflow:hidden;background:#EFECE2;display:flex;align-items:center;justify-content:center;color:var(--ink3);flex:none}
.photopick .pv img{width:100%;height:100%;object-fit:cover}
.poswrap{background:var(--green-ink);border-radius:16px;color:#EAF0EA;padding:18px 18px 14px;margin-bottom:14px;position:relative;overflow:hidden}

function attachCombo(input,opts){
 let box=null;
 const close=()=>{if(box){box.remove();box=null}};
 const insert=()=>{const p=input.parentElement;if(!p)return;if(getComputedStyle(p).position==='static')p.style.position='relative';p.appendChild(box)};
 const open=()=>{
  const q=(input.value||'').trim().toLowerCase();
  const pool=opts.getPool().filter(o=>!q||String(o.label).toLowerCase().includes(q)||String(o.sub||'').toLowerCase().includes(q)).slice(0,10);
  close();
  if(!pool.length){
   if(q){box=document.createElement('div');box.className='combo';box.innerHTML='<div class="combo-empty">No match found</div>';insert()}
   return}
  box=document.createElement('div');box.className='combo';
  box.innerHTML=pool.map((o,i)=>`<div class="combo-it" data-i="${i}"><b>${esc(o.label)}</b><span>${esc(o.sub||'')}</span></div>`).join('');
  insert();
  box.querySelectorAll('.combo-it').forEach(el=>{
   el.addEventListener('pointerdown',e=>{e.preventDefault();const o=pool[+el.dataset.i];input.value=o.label;close();opts.onPick&&opts.onPick(o)})});
 };
 input.addEventListener('input',open);
 input.addEventListener('focus',open);
 input.addEventListener('blur',()=>setTimeout(close,160));
}

function resizeImage(file,maxEdge,quality){return new Promise((res,rej)=>{
 const rd=new FileReader();
 rd.onload=()=>{const img=new Image();
  img.onload=()=>{const sc=Math.min(1,maxEdge/Math.max(img.width,img.height));
   const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
   c.getContext('2d').drawImage(img,0,0,c.width,c.height);
   res(c.toDataURL('image/jpeg',quality))};
  img.onerror=()=>rej(new Error('bad image'));img.src=rd.result};
 rd.onerror=()=>rej(new Error('read failed'));rd.readAsDataURL(file)})}

function stockOf(itemId){let q=+(itemById(itemId)?.openingStock)||0;
 PURCHASES().forEach(d=>LINES(d).forEach(l=>{if(l.itemId===itemId)q+=(+l.qty||0)}));
 SALES().forEach(d=>LINES(d).forEach(l=>{if(l.itemId===itemId)q-=(+l.qty||0)}));
 PRET().forEach(d=>{if(d.goodsBack!==false)LINES(d).forEach(l=>{if(l.itemId===itemId)q-=(+l.qty||0)})});
 SRET().forEach(d=>{if(d.goodsBack!==false)LINES(d).forEach(l=>{if(l.itemId===itemId)q+=(+l.qty||0)})});
 ADJ().forEach(a=>{if(a&&a.itemId===itemId)q+=(+a.delta||0)});
 return q}
function avgCost(it){let q=+(it.openingStock)||0,v=q*(+(it.openingRate)||+(it.purchaseRate)||0);
 PURCHASES().forEach(d=>LINES(d).forEach(l=>{if(l.itemId===it.id){q+=(+l.qty||0);v+=(+l.qty||0)*(+l.rate||0)}}));
 ADJ().forEach(a=>{if(a&&a.itemId===it.id&&+a.delta>0&&+a.rate)v+=(+a.delta)*(+a.rate),q+=(+a.delta)});
 return q>0?v/q:((+(it.purchaseRate))||(+(it.openingRate))||0)}
function stockRows(){return ITEMS().map(it=>{const qty=stockOf(it.id);return{it,qty,ac:avgCost(it),value:qty*avgCost(it)}}).sort((a,b)=>b.value-a.value)}
function docSub(d){return sum(LINES(d),l=>(+l.qty||0)*(+l.rate||0))}
function saleLinesOf(invs){const rows=[];(invs||[]).forEach(d=>{const sub=docSub(d);LINES(d).forEach(l=>{const g=(+l.qty||0)*(+l.rate||0);rows.push({itemId:l.itemId,qty:+l.qty||0,gross:g,net:g-((+d.discount||0)*(sub?g/sub:0)),date:d.date})})});return rows}
function purchaseLinesOf(docs){const rows=[];(docs||[]).forEach(d=>LINES(d).forEach(l=>rows.push({itemId:l.itemId,qty:+l.qty||0,amt:(+l.qty||0)*(+l.rate||0),date:d.date})));return rows}
function partyEntries(pid){const es=[];const p=partyById(pid);if(!p)return es;
 if(+p.openingBalance)es.push({date:p.openingDate||'2000-01-01',desc:'Opening Balance',ref:'',dr:p.openingType==='cr'?0:+p.openingBalance,cr:p.openingType==='cr'?+p.openingBalance:0,pr:0,_c:0});
 SALES().filter(d=>d.partyId===pid).forEach(d=>{es.push({date:d.date,desc:'Sale Invoice',ref:d.no,dr:+d.total,cr:0,pr:1,_c:d.created,link:'sales/view/'+d.id});if(+d.paid)es.push({date:d.date,desc:'Cash with invoice',ref:d.no,dr:0,cr:+d.paid,pr:2,_c:d.created})});
 PURCHASES().filter(d=>d.partyId===pid).forEach(d=>{es.push({date:d.date,desc:'Purchase Invoice',ref:d.no,dr:0,cr:+d.total,pr:1,_c:d.created,link:'purchases/view/'+d.id});if(+d.paid)es.push({date:d.date,desc:'Cash paid with invoice',ref:d.no,dr:+d.paid,cr:0,pr:2,_c:d.created})});
 SRET().filter(d=>d.partyId===pid).forEach(d=>{if(d.settle==='credit')es.push({date:d.date,desc:'Sale Return'+(d.goodsBack!==false?'':' (credit only)'),ref:d.no,dr:0,cr:+d.total,pr:3,_c:d.created,link:'sale-returns/view/'+d.id});else es.push({date:d.date,desc:'Sale Return — cash settled',ref:d.no,dr:0,cr:0,pr:3,_c:d.created,memo:true})});
 PRET().filter(d=>d.partyId===pid).forEach(d=>{if(d.settle==='credit')es.push({date:d.date,desc:'Purchase Return'+(d.goodsBack!==false?'':' (credit only)'),ref:d.no,dr:+d.total,cr:0,pr:3,_c:d.created,link:'purchase-returns/view/'+d.id});else es.push({date:d.date,desc:'Purchase Return — cash settled',ref:d.no,dr:0,cr:0,pr:3,_c:d.created,memo:true})});
 RECEIPTS().filter(r=>r.partyId===pid).forEach(r=>es.push({date:r.date,desc:'Cash received',ref:r.mode,dr:0,cr:+r.amount,pr:4,_c:r.created}));
 PAYMENTS().filter(r=>r.partyId===pid).forEach(r=>es.push({date:r.date,desc:'Cash paid',ref:r.mode,dr:+r.amount,cr:0,pr:4,_c:r.created}));
 return es.sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999')||a.pr-b.pr||(a._c||0)-(b._c||0))}
function partyBalance(pid){return sum(partyEntries(pid),e=>e.dr-e.cr)}

function drawCheckBody(){const dc=S.dashCheck;let f=dc.from||'2000-01-01',t=dc.to||todayISO();
 if(f>t){const x=f;f=t;t=x}
 const showProfit=isMgr();
 const invs=SALES().filter(d=>inR(d.date,f,t)),rets=SRET().filter(d=>inR(d.date,f,t));

 const gS=sum(invs,d=>d.total),rS=sum(rets,d=>d.total),netS=gS-rS;

 let rev=0,cogs=0;
 if(showProfit){
  invs.forEach(d=>{const sub=docSub(d);LINES(d).forEach(l=>{const g=(+l.qty||0)*(+l.rate||0),net=g-((+d.discount||0)*(sub?g/sub:0));rev+=net;cogs+=(+l.qty||0)*AC(l.itemId)})});
  rets.forEach(rt=>{LINES(rt).forEach(l=>{const c=rt.goodsBack!==false?(+l.qty||0)*AC(l.itemId):0;rev-=(+l.qty||0)*(+l.rate||0);cogs-=c})})}
 const profit=rev-cogs,mg=rev>0.004?(profit/rev*100):0;
 const collected=sum(invs,d=>+d.paid)+sum(RECEIPTS().filter(x=>inR(x.date,f,t)),x=>x.amount);

  ${showProfit?sumTile('Margin',rev>0.004?mg.toFixed(1)+'%':'—',profit>=0?'var(--green)':'var(--red)'):''}
 </div>
 <div style="border-top:1px dashed var(--line);padding-top:8px;max-width:560px">

  <div class="trow grand"><span>Sales − purchases (net trading)</span><b>${money(netS-netP)}</b></div>

  ${g}${xl}

const PRESETS=[['today','Today'],['7d','7 days'],['month','This month'],['lmonth','Last month'],['30d','30 days'],['all','All']];
function presetRange(k){const t=todayISO();if(k==='today')return[t,t];if(k==='7d')return[addDays(t,-6),t];if(k==='month')return[monthStart(t),t];
 if(k==='lmonth'){const e=addDays(monthStart(t),-1);return[monthStart(e),e]}if(k==='30d')return[addDays(t,-29),t];return['2000-01-01',t]}
const inR=(d,f,t)=>d>=f&&d<=t;
function rangeBar(key){const r=S.report[key];
 return `<div class="rangebar"><div class="tabs" style="margin-bottom:0">${PRESETS.map(p=>`<button class="chip ${r.preset===p[0]?'on':''}" data-pk="${p[0]}">${p[1]}</button>`).join('')}</div>
 <div class="rdates"><input type="date" class="in rfrom" value="${r.from}"><span class="muted">→</span><input type="date" class="in rto" value="${r.to}"></div></div>`}
function bindRange(key){qsa('[data-pk]').forEach(b=>b.onclick=()=>{const[f,t]=presetRange(b.dataset.pk);Object.assign(S.report[key],{preset:b.dataset.pk,from:f,to:t});route()});
 const f=V().querySelector('.rfrom'),t=V().querySelector('.rto');
 if(f)f.onchange=e=>{S.report[key].from=e.target.value;S.report[key].preset='custom';route()};
 if(t)t.onchange=e=>{S.report[key].to=e.target.value;S.report[key].preset='custom';route()}}
function tabsHtml(key,tab,defs){return `<div class="tabs">${defs.map(d=>`<button class="chip ${tab===d[0]?'on':''}" data-tab="${d[0]}">${d[1]}</button>`).join('')}</div>`}
function bindTabs(key){qsa('[data-tab]').forEach(b=>b.onclick=()=>{S.report[key].tab=b.dataset.tab;route()})}
function barRow(label,sub,val,max,color){const w=max>0?Math.max(2,val/max*100):0;
 return `<div class="brow"><div><span class="bname">${esc(label)}</span>${sub?`<span class="bsub">${sub}</span>`:''}</div><div class="btrack"><i style="width:${w}%;background:${color}"></i></div><div class="bv">${money(val)}</div></div>`}
function sumTile(l,v,c){return `<div class="sum"><span class="lbl">${l}</span><b ${c?`style="color:${c}"`:''}>${v}</b></div>`}
function emptyHtml(icon,msg){return `<div class="empty">${ic(icon,34)}<div class="big">${msg}</div></div>`}
function mk([f,t]){return{from:f,to:t}}

function vReportStock() {
  setTop('Stock Valuation');
  setActiveNav('r/stock');

  S.report.stock = S.report.stock || {
    tab: 'item',
    basis: 'cost'
  };

  const key = 'stock';

  const draw = () => {
    const st = S.report[key];
    const tab = st.tab;
    const co = S.me.role === 'company';
    const basis = co ? 'cost' : (st.basis || 'cost');

    // Ensure brands are loaded before drawing brand-wise valuation.
    if (tab === 'brand' && !BRANDS().length) {
      DB.collection('brands').get().then(s => {
        state.brands = s.docs.map(d =>
          Object.assign({ id: d.id }, d.data())
        );
        draw();
      }).catch(err => {
        console.error('Failed to load brands:', err);
      });
      return;
    }

    const rows = stockRows().map(x => {
      const sv = x.qty * (+x.it.saleRate || 0);
      const cv = x.value;

      return {
        it: x.it,
        qty: x.qty,
        ac: x.ac,
        cv,
        sv,
        profit: sv - cv
      };
    });

    const totC = sum(rows, x => x.cv);
    const totS = sum(rows, x => x.sv);
    const totP = totS - totC;
    const mg = totS > 0.004 ? (totP / totS) * 100 : 0;

    const val = x => basis === 'cost' ? x.cv : x.sv;
    const barCol = basis === 'cost'
      ? 'var(--green)'
      : 'var(--amber)';

    let body = '';

    if (tab === 'item') {
      const arr = rows.slice().sort((a, b) => val(b) - val(a));
      const mx = Math.max(1, ...arr.map(val));

      body = arr.length
        ? arr.map(x => {
            const v = val(x);

            const category = catById(x.it.categoryId);
            const brand = brandById(x.it.brandId);

            const meta =
              `${esc(category?.name || '—')} · ` +
              `${esc(brand?.name || '—')}`;

            const sub = co
              ? `${meta} · ${x.qty} pcs @ cost ${money(x.ac)}`
              : basis === 'cost'
                ? `${meta} · ${x.qty} pcs @ cost ${money(x.ac)} · sale ${money(x.sv)}`
                : `${meta} · ${x.qty} pcs @ sell ${money(x.it.saleRate)} · cost ${money(x.cv)} · ` +
                  `<b style="color:${x.profit >= 0 ? 'var(--green)' : 'var(--red)'}">` +
                  `${x.profit >= 0 ? 'profit' : 'loss'} ${money(Math.abs(x.profit))}</b>`;

            return `
              <div class="brow">
                <div>
                  <span class="bname">${esc(x.it.name)}</span>
                  <span class="bsub">${sub}</span>
                </div>
                <div class="btrack">
                  <i style="width:${Math.max(2, v / mx * 100)}%;background:${barCol}"></i>
                </div>
                <div class="bv">${money(v)}</div>
              </div>`;
          }).join('') +
          `<div class="trow grand" style="max-width:420px;margin-left:auto">
            <span class="lbl">${basis === 'cost' ? 'Total stock @ cost' : 'Total stock @ sale price'}</span>
            <b style="font-size:17px">${money(basis === 'cost' ? totC : totS)}</b>
          </div>`
        : emptyHtml('box', 'No items yet');

    } else {
      const dim = tab === 'brand' ? 'brandId' : 'categoryId';
      const pool = dim === 'brand' ? BRANDS() : CATS();

      // Normalize IDs to strings and trim accidental whitespace.
      const groups = groupBy(rows, x => {
        const id = String(x.it?.[dim] ?? '').trim();
        return id || '__na';
      });

      const arr = Object.keys(groups).map(id => {
        const g = groups[id];

       
const normalizedId = String(id).trim();

const src = id === '__na'
  ? null
  : (
      dim === 'brand'
        ? BRANDS().find(z =>
            String(z.id).trim() === normalizedId
          )
        : CATS().find(z =>
            String(z.id).trim() === normalizedId
          )
    ) || null;
        const gcv = sum(g, x => x.cv);
        const gsv = sum(g, x => x.sv);

        return {

name: id === '__na'
  ? 'Unassigned'
  : (src ? src.name : id),

          
          qty: sum(g, x => x.qty),
          cv: gcv,
          sv: gsv,
          profit: gsv - gcv
        };
      }).sort((a, b) => val(b) - val(a));

      const tot = sum(arr, a => val(a)) || 1;

      // Category-wise chart.
      if (tab === 'category' && arr.length) {
        const cols = [
          '#0C6B4A', '#B23B2A', '#A9720E', '#16382A',
          '#5B8A74', '#C98A6B', '#3E5C4B', '#8FA795'
        ];

        let acc = 0;

        const stops = arr.map((a, i) => {
          const s0 = acc / tot * 100;
          acc += val(a);
          const s1 = acc / tot * 100;

          return `${cols[i % cols.length]} ${s0.toFixed(1)}% ${s1.toFixed(1)}%`;
        }).join(',');

        body += `
          <div style="display:flex;gap:22px;align-items:center;flex-wrap:wrap;margin-bottom:14px">
            <div style="width:130px;height:130px;border-radius:50%;background:conic-gradient(${stops});position:relative;flex:none">
              <div style="position:absolute;inset:26px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column">
                <span class="lbl">${basis === 'cost' ? '@ cost' : '@ sale'}</span>
                <b class="mono" style="font-size:14px">${compact(tot)}</b>
              </div>
            </div>
            <div style="flex:1;min-width:200px">
              ${arr.map((a, i) => `
                <div style="display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:13px">
                  <span style="display:flex;gap:8px;align-items:center">
                    <i class="dot" style="background:${cols[i % cols.length]}"></i>
                    ${esc(a.name)}
                  </span>
                  <span class="mono muted">${(val(a) / tot * 100).toFixed(1)}% · ${money(val(a))}</span>
                </div>
              `).join('')}
            </div>
          </div>`;
      }

      const gmx = Math.max(1, ...arr.map(val));

      body += arr.length
        ? arr.map(a => {
            const v = val(a);

            return `
              <div class="brow">
                <div>
                  <span class="bname">${esc(a.name)}</span>
                  <span class="bsub">
                    ${a.qty} pcs · cost ${money(a.cv)}${co ? '' :
                      ` · sale ${money(a.sv)} · potential ${a.profit >= 0 ? '+' : '-'}${money(Math.abs(a.profit))}`}
                  </span>
                </div>
                <div class="btrack">
                  <i style="width:${Math.max(2, v / gmx * 100)}%;background:${barCol}"></i>
                </div>
                <div class="bv">${money(v)}</div>
              </div>`;
          }).join('')
        : emptyHtml('layers', 'Nothing to value yet');
    }

    V().innerHTML = `
      <div class="pagehead">
        <div>
          <div class="ptitle">Stock Valuation</div>
          <div class="psub">Weighted-average cost vs current sale price · includes admin stock adjustments</div>
        </div>
      </div>

      ${co ? '' : `
        <div class="tabs" style="margin-bottom:8px">
          <button class="chip ${basis === 'cost' ? 'on' : ''}" data-bs="cost">At Cost</button>
          <button class="chip ${basis === 'sale' ? 'on' : ''}" data-bs="sale">At Sale Price</button>
        </div>`}

      <div class="sumrow">
        ${sumTile('Stock @ cost', money(totC))}
        ${co
          ? sumTile('Units in stock', sum(rows, x => x.qty))
          : sumTile('Stock @ sale price', money(totS), 'var(--amber)')}
        ${co ? '' : sumTile('Potential profit', money(totP), totP >= 0 ? 'var(--green)' : 'var(--red)')}
        ${co ? '' : sumTile('Potential margin', mg.toFixed(1) + '%', mg >= 0 ? 'var(--green)' : 'var(--red)')}
      </div>

      ${tabsHtml(key, tab, [
        ['item', 'Item-wise'],
        ['brand', 'Brand-wise'],
        ['category', 'Category-wise']
      ])}

      <div class="card cardpad">${body}</div>

      ${co ? '' : `
        <p class="muted" style="font-size:12px;margin-top:10px">
          <b>@ Cost</b> values stock at weighted-average purchase cost — what you own (assets).
          <b>@ Sale price</b> values the same units at today's selling rates — potential revenue
          if everything sells at list price; the difference is potential gross profit, before
          discounts and expenses. Items without a brand/category set appear under
          <b>Unassigned</b>.
        </p>`}`;

    qsa('[data-bs]').forEach(b => {
      b.onclick = () => {
        st.basis = b.dataset.bs;
        draw();
      };
    });

    bindTabs(key);
  };

  draw();
}

function vReportProfit(){setTop('Profit Analysis');setActiveNav('r/profit');S.report.profit=S.report.profit||{preset:'month',tab:'date',...mk(presetRange('month'))};
 const key='profit';const draw=()=>{const r=S.report[key],f=r.from,t=r.to;
  const ac={};const AC=id=>ac[id]||(ac[id]=avgCost(itemById(id)));
  const invs=SALES().filter(d=>inR(d.date,f,t)),rets=SRET().filter(d=>inR(d.date,f,t));
  let rev=0,cogs=0;const rows=[];
  const push=(dimK,net,cost)=>{let row=rows.find(x=>x.k===dimK);if(!row){row={k:dimK,rev:0,cogs:0};rows.push(row)}row.rev+=net;row.cogs+=cost};
  invs.forEach(d=>{const sub=docSub(d);LINES(d).forEach(l=>{const it=itemById(l.itemId);if(!it)return;const g=(+l.qty||0)*(+l.rate||0),net=g-((+d.discount||0)*(sub?g/sub:0)),c=(+l.qty||0)*AC(l.itemId);rev+=net;cogs+=c;push('d:'+d.date,net,c);push('i:'+l.itemId,net,c);push('c:'+(it.categoryId||'—'),net,c)})});
  rets.forEach(rt=>{LINES(rt).forEach(l=>{const it=itemById(l.itemId);if(!it)return;const net=(+l.qty||0)*(+l.rate||0),c=rt.goodsBack!==false?(+l.qty||0)*AC(l.itemId):0;rev-=net;cogs-=c;push('d:'+rt.date,-net,-c);push('i:'+l.itemId,-net,-c);push('c:'+(it.categoryId||'—'),-net,-c)})});
  const profit=rev-cogs,margin=rev>0?profit/rev*100:0;
  const label=k=>k.startsWith('d:')?fmtDate(k.slice(2)):k.startsWith('i:')?(itemById(k.slice(2))?.name||'—'):(catById(k.slice(2))?.name||'—');
  let body='';const tab=r.tab,pre={date:'d:',item:'i:',category:'c:'}[tab];
  const arr=rows.filter(x=>x.k.startsWith(pre)).sort((a,b)=>(b.rev-b.cogs)-(a.rev-a.cogs));
  const mx=Math.max(1,...arr.map(x=>Math.abs(x.rev-x.cogs)));
  body=arr.length?arr.map(x=>{const pr=x.rev-x.cogs;return `<div class="brow"><div><span class="bname">${esc(label(x.k))}</span><span class="bsub">rev ${money(x.rev)} · cogs ${money(x.cogs)}</span></div><div class="btrack"><i style="width:${Math.abs(pr)/mx*100}%;background:${pr>=0?'var(--green)':'var(--red)'}"></i></div><div class="bv" style="color:${pr>=0?'var(--green)':'var(--red)'}">${money(pr)}</div></div>`}).join(''):emptyHtml('chart','No sales in this period');
  V().innerHTML=`<div class="pagehead"><div><div class="ptitle">Profit Analysis</div><div class="psub">Gross margin on weighted-average cost · ${fmtDate(f)} → ${fmtDate(t)}</div></div></div>
  ${rangeBar(key)}
  <div class="sumrow">${sumTile('Net revenue',money(rev))}${sumTile('Cost of goods',money(cogs))}${sumTile('Gross profit',money(profit),profit>=0?'var(--green)':'var(--red)')}${sumTile('Margin',margin.toFixed(1)+'%',margin>=0?'var(--green)':'var(--red)')}</div>
  ${tabsHtml(key,r.tab,[['date','Date-wise'],['item','Item-wise'],['category','Category-wise']])}
  <div class="card cardpad">${body}</div>
  <p class="muted" style="font-size:12px;margin-top:10px">Credit-only returns reduce revenue without returning stock; cash operating expenses and overheads are not included — this is trading gross profit.</p>`;
  bindRange(key);bindTabs(key)};
 draw()}

function vUsers(){setTop('Users & Customers');setActiveNav('users');
 const me=S.me;S.usersTab=S.usersTab||'team';
 const draw=()=>{const tab=S.usersTab;
  const team=USERS().filter(x=>x.role!=='customer'),custs=USERS().filter(x=>x.role==='customer');
  const pend=RESETS().filter(r=>r.status==='pending'),done=RESETS().filter(r=>r.status==='done').slice(-6).reverse();
  const regs=(state.regReqs||[]).filter(r=>r.status==='pending');
  const invs=INVITES().slice().sort((a,b)=>(b.createdTs||0)-(a.createdTs||0));
  const openInv=invs.filter(v=>inviteState(v)[0]==='open').length;
  const canTouch=t=>me.role==='super'||(me.role==='admin'&&t.role!=='super');
  let body='';
  if(tab==='team'){body=`<button class="btn btn-primary" id="tuNew" style="margin-bottom:12px">${ic('plus',16)}Add staff / admin directly</button>
   <div class="card"><div class="list">${team.length?team.map(t=>{const ini=t.name.split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase();
    return `<div class="lrow editmode"><span class="avatar">${ini}</span>
    <div class="lmain"><div class="lname">${esc(t.name)}</div><div class="lsub"><span class="mono">${esc(t.mobile||'—')}</span></div></div>
    <span class="badge ${t.role==='super'?'b-amber':t.role==='admin'?'b-green':'b-gray'}">${t.role==='super'?'Super admin':t.role==='company'?'Company':t.role}</span>
    <span class="badge ${t.active!==false?'b-green':'b-gray'}">${t.active!==false?'Active':'Off'}</span>
    ${canTouch(t)?`<div style="display:flex;gap:6px"><button class="icon-btn" data-pw="${t.id}" title="Reset password">${ic('gear',15)}</button><button class="icon-btn" data-tg="${t.id}">${ic(t.active!==false?'x':'check',15)}</button><button class="icon-btn" data-del="${t.id}" style="color:var(--red)">${ic('trash',15)}</button></div>`:''}</div>`}).join(''):`<div class="empty">No team accounts yet.</div>`}</div></div>
   <p class="muted" style="font-size:12px;margin-top:10px">Tip: use <b>Invites</b> when someone signs in on their own device — they choose their own password privately.</p>`}
  else if(tab==='customers'){body=`<button class="btn btn-primary" id="tcNew" style="margin-bottom:12px">${ic('plus',16)}Create customer login</button>
   <div class="card"><div class="list">${custs.length?custs.map(t=>{const p=partyById(t.partyId);const bal=p?partyBalance(p.id):0;const ini=t.name.split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase();
    return `<div class="lrow editmode"><span class="avatar">${ini}</span>
    <div class="lmain"><div class="lname">${esc(t.name)}</div><div class="lsub"><span class="mono">${esc(t.mobile||'—')}</span><span>·</span><span>${esc(p?p.name:'no party linked')}</span></div></div>
    <div class="lright"><div class="lamt" style="font-size:13px;color:${bal>0.004?'var(--red)':'var(--green)'}">${money(Math.abs(bal))}</div><div class="lmeta">${Math.abs(bal)<0.004?'settled':'due'}</div></div>
    <span class="badge ${t.active!==false?'b-green':'b-gray'}">${t.active!==false?'Active':'Off'}</span>
    <div style="display:flex;gap:6px"><button class="icon-btn" data-pw="${t.id}" title="Reset password">${ic('gear',15)}</button><button class="icon-btn" data-tg="${t.id}">${ic(t.active!==false?'x':'check',15)}</button><button class="icon-btn" data-del="${t.id}" style="color:var(--red)">${ic('trash',15)}</button></div></div>`}).join(''):`<div class="empty">${ic('user',34)}<div class="big">No customer logins yet</div>Create one so they can order from the shop.</div>`}</div></div>`}
  else if(tab==='regs'){body=regs.length?`<div class="card"><div class="list">${regs.map(r=>`
    <div class="lrow editmode"><div class="lmain"><div class="lname">${esc(r.name)}</div><div class="lsub"><span class="mono">${esc(r.mobile)}</span>${r.city?'<span>·</span><span>'+esc(r.city)+'</span>':''}${r.note?'<span>·</span><span>'+esc(r.note)+'</span>':''}</div></div><span class="lmeta">${timeAgo(r.created)}</span>
    <button class="btn btn-primary btn-sm" data-appr="${r.id}" data-mob="${esc(r.mobile)}" data-nm="${esc(r.name)}" data-city="${esc(r.city||'')}">Approve</button><button class="icon-btn" data-rej="${r.id}" style="color:var(--red)" title="Reject">${ic('x',15)}</button></div>`).join('')}</div></div>`
   :`<div class="notice green" style="margin-bottom:14px">${ic('check',15)}<div>No pending sign-up requests.</div></div>`}
  else if(tab==='invites'){body=`<button class="btn btn-primary" id="tiNew" style="margin-bottom:12px">${ic('plus',16)}New invite code</button>
   <div class="card"><div class="list">${invs.length?invs.map(v=>{const st=inviteState(v);
    return `<div class="lrow editmode"><div class="lmain"><div class="lname"><span class="mono" style="letter-spacing:.05em">${esc(v.id)}</span><span class="badge ${v.role==='admin'?'b-green':'b-gray'}">${v.role}</span></div>
    <div class="lsub"><span>${st[1]}</span>${st[0]==='open'&&v.days?`<span>· expires in ${Math.max(1,Math.ceil((v.createdTs+v.days*864e5-Date.now())/864e5))}d</span>`:''}${v.used?`<span>· used by ${esc(v.usedBy||'—')}</span>`:''}</div></div>
    ${st[0]==='open'?`<button class="btn btn-ghost btn-sm" data-cp="${v.id}">${ic('edit',14)}Copy</button><button class="icon-btn" data-rv="${v.id}" style="color:var(--red)" title="Revoke">${ic('trash',15)}</button>`:st[0]==='expired'?`<button class="icon-btn" data-rv="${v.id}" style="color:var(--red)">${ic('trash',15)}</button>`:''}</div>`}).join(''):`<div class="empty">${ic('tag',34)}<div class="big">No invite codes</div>Generate one and share it privately with your staff member.</div>`}</div></div>
   <div class="notice" style="margin-top:14px">${ic('alert',15)}<div>Invite codes are the <b>only</b> way someone can create a staff/admin account. Share them by private WhatsApp only, and revoke any code that isn't used.</div></div>`}
  else{body=(pend.length?`<div class="lbl" style="margin:4px 0 8px">Pending requests</div><div class="card" style="margin-bottom:14px"><div class="list">${pend.map(r=>`
    <div class="lrow editmode"><div class="lmain"><div class="lname">${esc(USERS().find(x=>x.mobile===r.mobile)?.name||'Account '+r.mobile)}</div><div class="lsub"><span class="mono">${esc(r.mobile)}</span></div></div><span class="lmeta">${timeAgo(r.created)}</span>
    <button class="btn btn-primary btn-sm" data-resetm="${r.mobile}">Set new password</button></div>`).join('')}</div></div>`:`<div class="notice green" style="margin-bottom:14px">${ic('check',15)}<div>No pending password-reset requests.</div></div>`)
   +(done.length?`<div class="lbl" style="margin:4px 0 8px">Recently reset</div><div class="card"><div class="list">${done.map(r=>`<div class="lrow editmode"><div class="lmain"><div class="lname">${esc(USERS().find(x=>x.mobile===r.mobile)?.name||r.mobile)}</div><div class="lsub"><span class="mono">${esc(r.mobile)}</span></div></div><span class="badge b-green">Done</span><span class="lmeta">${timeAgo(r.doneTs||r.created)}</span></div>`).join('')}</div></div>`:'')}
  V().innerHTML=`<div class="pagehead"><div><div class="ptitle">Users & Customers</div><div class="psub">All login IDs are mobile numbers · customer sign-ups need your approval</div></div></div>
  <div class="tabs">
   <button class="chip ${tab==='team'?'on':''}" data-ut="team">Team (${team.length})</button>
   <button class="chip ${tab==='customers'?'on':''}" data-ut="customers">Customers (${custs.length})</button>
   <button class="chip ${tab==='regs'?'on':''}" data-ut="regs">Sign-up requests${regs.length?` <span class="nbadge">${regs.length}</span>`:''}</button>
   <button class="chip ${tab==='invites'?'on':''}" data-ut="invites">Invites${openInv?` <span class="nbadge">${openInv}</span>`:''}</button>
   <button class="chip ${tab==='resets'?'on':''}" data-ut="resets">Reset requests${pend.length?` <span class="nbadge">${pend.length}</span>`:''}</button>
  </div>${body}`;
  qsa('[data-ut]').forEach(b=>b.onclick=()=>{S.usersTab=b.dataset.ut;draw()});
  const tn=$('#tuNew');if(tn)tn.onclick=()=>openTeamModal();
  const cn=$('#tcNew');if(cn)cn.onclick=()=>openCustomerModal();
  const tin=$('#tiNew');if(tin)tin.onclick=()=>openInviteModal();
  qsa('[data-appr]').forEach(b=>b.onclick=()=>openApproveModal(b.dataset.appr,b.dataset.mob,b.dataset.nm,b.dataset.city||''));
  qsa('[data-rej]').forEach(b=>b.onclick=()=>confirmBox('Reject request?','They will be asked to contact you directly.',()=>{dbUpdate('regRequests',b.dataset.rej,{status:'rejected'})}));
  qsa('[data-cp]').forEach(b=>b.onclick=()=>copyText(b.dataset.cp));
  qsa('[data-rv]').forEach(b=>b.onclick=()=>confirmBox('Revoke this invite?','The code will stop working immediately.',()=>{dbDel('invites',b.dataset.rv);toast('Invite revoked')}));
  qsa('[data-pw]').forEach(b=>b.onclick=()=>openResetPwModal(USERS().find(x=>x.id===b.dataset.pw)));
  qsa('[data-resetm]').forEach(b=>b.onclick=()=>{const u2=USERS().find(x=>x.mobile===b.dataset.resetm);if(u2)openResetPwModal(u2,RESETS().find(r=>r.mobile===u2.mobile&&r.status==='pending')?.id)});
  qsa('[data-tg]').forEach(b=>b.onclick=()=>{const t=USERS().find(x=>x.id===b.dataset.tg);
   if(t.id===me.id)return toast("You can't disable yourself",'err');
   dbUpdate('users',t.id,{active:t.active===false})});
  qsa('[data-del]').forEach(b=>b.onclick=()=>{const t=USERS().find(x=>x.id===b.dataset.del);
   if(t.id===me.id)return toast("You can't delete yourself",'err');
   if(t.role==='super'&&USERS().filter(x=>x.role==='super'&&x.active!==false).length<=1)return toast('Last super admin cannot be removed','err');
   confirmBox('Remove '+t.name+'?','They will immediately lose access.',()=>{dbDel('users',t.id);if(t.mobile)dbDel('logins',t.mobile);toast('Account removed')})})};
 draw()}
async function openInviteModal(){const me=S.me;

 openModal(`<div class="mhead"><h3>New invite code</h3><button class="icon-btn" onclick="closeModal()">${ic('x')}</button></div>
 <div class="mbody"><form id="ivForm">
  <div class="frow"><div class="field"><label class="fl">Role</label><select class="sel" id="iv-role">${roles.map(r=>`<option value="${r[0]}">${r[1]}</option>`).join('')}</select></div>

  <div class="mbody" style="text-align:center">
   <span class="lbl">Share this code privately</span>
   <div class="mono" style="font:700 30px var(--mono);letter-spacing:.08em;margin:12px 0">${esc(code)}</div>
   <p class="muted" style="font-size:13px">Role: <b>${esc($('#iv-role').value)}</b> · expires in ${$('#iv-days').value} days · one-time use.</p>
   <button class="btn btn-primary" style="width:100%;margin-top:8px" id="ivCopy">${ic('edit',16)}Copy code</button></div>`);
  $('#ivCopy').onclick=()=>copyText(code)}}
async function openTeamModal(){const me=S.me;
 const roles=me.role==='super'?[['staff','Staff'],['company','Company · figures only'],['admin','Admin'],['super','Super admin']]:[['staff','Staff'],['company','Company · figures only']];
 openModal(`<div class="mhead"><h3>Add staff / admin directly</h3><button class="icon-btn" onclick="closeModal()">${ic('x')}</button></div>
 <div class="mbody"><form id="nuForm">
  <div class="field"><label class="fl">Full name</label><input class="in" id="nu-name" required></div>
  <div class="frow"><div class="field"><label class="fl">Mobile (login ID)</label><input class="in" id="nu-user" required inputmode="numeric" placeholder="10-digit mobile"></div>
  <div class="field"><label class="fl">Role</label><select class="sel" id="nu-role">${roles.map(r=>`<option value="${r[0]}">${r[1]}</option>`).join('')}</select></div></div>
  <div class="field"><label class="fl">Password</label><input class="in" id="nu-pass" type="password" required></div>
  <div id="nuErr" class="notice red" style="display:none"></div>
  <div class="muted" style="font-size:12px;margin-bottom:14px">Share the mobile + password privately. Prefer an invite code when the person uses their own device.</div>
  <button class="btn btn-primary" style="width:100%">Create account</button></form></div>`);
 $('#nuForm').onsubmit=async e=>{e.preventDefault();const err=m=>{const n=$('#nuErr');n.style.display='flex';n.innerHTML=ic('alert',15)+'<span>'+esc(m)+'</span>'};
  const mob=normMobile($('#nu-user').value),name=$('#nu-name').value.trim(),pw=$('#nu-pass').value,role=$('#nu-role').value;
  if(!validMobile(mob))return err('Enter a valid 10-digit mobile number');
  if(pw.length<4)return err('Password too short');
  if(role==='super'&&me.role!=='super')return err('Only a super admin can create another super admin');
  try{
   const newUid=await createAuthUser(mobileToEmail(mob),pw);
   const batch=DB.batch();
   batch.set(DB.collection('users').doc(newUid),{name,mobile:mob,role,active:true,created:Date.now()});
   batch.set(DB.collection('logins').doc(mob),{email:mobileToEmail(mob)});
   await batch.commit();
   closeModal();toast('Account created — ID: '+mob);route()}
  catch(ex){err(ex.code==='auth/email-already-in-use'?'This mobile number already has an account.':'Failed: '+ex.code)}}}
async function openCustomerModal(){
 openModal(`<div class="mhead"><h3>Create customer login</h3><button class="icon-btn" onclick="closeModal()">${ic('x')}</button></div>
 <div class="mbody"><form id="ncForm">
  <div class="field"><label class="fl">Customer name</label><input class="in" id="nc-name" required></div>
  <div class="frow"><div class="field"><label class="fl">Mobile (login ID)</label><input class="in" id="nc-mob" required inputmode="numeric" placeholder="10-digit mobile"></div>
  <div class="field"><label class="fl">Password</label><input class="in" id="nc-pass" type="password" required></div></div>
  <div class="field"><label class="fl">Link to ledger party</label>
   <label class="sego" style="margin-bottom:8px;display:inline-flex"><input type="checkbox" id="nc-new" checked><span>Create new party with this name</span></label>
   <div id="nc-pick" style="display:none">
     <div class="combowrap"><input class="in" id="nc-party-name" placeholder="Type to search existing party…" autocomplete="off"></div>
     <div class="combo-sub" id="nc-party-sub"></div>
   </div>
  </div>
  <div id="ncErr" class="notice red" style="display:none"></div>
  <div class="muted" style="font-size:12px;margin-bottom:14px">The customer signs in on the same site with this mobile number and can browse, cart and place orders. Orders reach you live.</div>
  <button class="btn btn-primary" style="width:100%">Create customer login</button></form></div>`);
 let pickedPid='';
 attachCombo($('#nc-party-name'),{getPool:()=>PARTIES().filter(p=>p.type!=='supplier').sort((a,b)=>a.name.localeCompare(b.name)).map(x=>({id:x.id,label:x.name,sub:`${x.type} · ${x.phone||'no phone'}`})),
  onPick:o=>{pickedPid=o.id;const p=partyById(o.id);$('#nc-party-sub').textContent=p?`${p.type} · ${p.phone||'no phone'}`:''}});
 $('#nc-new').onchange=()=>{$('#nc-pick').style.display=$('#nc-new').checked?'none':'block'};
 $('#ncForm').onsubmit=async e=>{e.preventDefault();const err=m=>{const n=$('#ncErr');n.style.display='flex';n.innerHTML=ic('alert',15)+'<span>'+esc(m)+'</span>'};
  const mob=normMobile($('#nc-mob').value),name=$('#nc-name').value.trim(),pw=$('#nc-pass').value;
  if(!validMobile(mob))return err('Enter a valid 10-digit mobile number');
  if(pw.length<4)return err('Password too short');
  const isNew=$('#nc-new').checked;
  if(!isNew&&!pickedPid)return err('Pick an existing party in the search box, or tick “Create new party”.');
  try{
   let pid;
   if(isNew){pid=dbAdd('parties',{name,type:'customer',phone:mob,address:'',openingBalance:0,openingType:'dr'}).id}
   else{pid=pickedPid}
   const newUid=await createAuthUser(mobileToEmail(mob),pw);
   const batch=DB.batch();
   batch.set(DB.collection('users').doc(newUid),{name,mobile:mob,role:'customer',partyId:pid,active:true,created:Date.now()});
   batch.set(DB.collection('logins').doc(mob),{email:mobileToEmail(mob)});
   await batch.commit();
   closeModal();toast('Customer login created — ID: '+mob);route()}
  catch(ex){err(ex.code==='auth/email-already-in-use'?'This mobile number already has an account.':'Failed: '+ex.code)}}}
function openApproveModal(reqId,mobile,name,city){
 openModal(`<div class="mhead"><h3>Approve — ${esc(name)}</h3><button class="icon-btn" onclick="closeModal()">${ic('x')}</button></div>
 <div class="mbody"><form id="apForm">
  <div class="notice green" style="margin:0 0 14px">${ic('check',15)}<div>Creates the ledger party + login <b class="mono">${esc(mobile)}</b>. Share the password with them on WhatsApp after approving.</div></div>
  <div class="frow"><div class="field"><label class="fl">Party name</label><input class="in" id="ap-name" required value="${esc(name)}"></div>
  <div class="field"><label class="fl">Password (you set it)</label><input class="in" id="ap-pass" type="password" required></div></div>
  <div class="frow"><div class="field"><label class="fl">Phone</label><input class="in" id="ap-phone" value="${esc(mobile)}"></div>
  <div class="field"><label class="fl">City / Address</label><input class="in" id="ap-city" value="${esc(city)}"></div></div>
  <div id="apErr" class="notice red" style="display:none"></div>
  <button class="btn btn-primary" style="width:100%">Approve & create login</button></form></div>`);
 $('#apForm').onsubmit=async e=>{e.preventDefault();const err=m=>{const n=$('#apErr');n.style.display='flex';n.innerHTML=ic('alert',15)+'<span>'+esc(m)+'</span>'};
  const nm=$('#ap-name').value.trim(),pw=$('#ap-pass').value,ph=$('#ap-phone').value.trim(),city=$('#ap-city').value.trim();
  if(pw.length<4)return err('Password too short');
  try{
   const pid=dbAdd('parties',{name:nm,type:'customer',phone:ph,address:city,openingBalance:0,openingType:'dr'}).id;
   const newUid=await createAuthUser(mobileToEmail(mobile),pw);
   const batch=DB.batch();
   batch.set(DB.collection('users').doc(newUid),{name:nm,mobile,role:'customer',partyId:pid,active:true,created:Date.now()});
   batch.set(DB.collection('logins').doc(mobile),{email:mobileToEmail(mobile)});
   batch.update(DB.collection('regRequests').doc(reqId),{status:'approved',approvedTs:Date.now()});
   await batch.commit();
   closeModal();toast('Customer approved — login created: '+mobile);route()}
  catch(ex){err(ex.code==='auth/email-already-in-use'?'This mobile already has an account.':'Failed: '+ex.code)}}}
function openResetPwModal(t,reqId){if(!t)return;
 openModal(`<div class="mhead"><h3>Reset password — ${esc(t.name)}</h3><button class="icon-btn" onclick="closeModal()">${ic('x')}</button></div>
 <div class="mbody"><form id="rpForm">
  <p class="muted" style="font-size:13px;margin-bottom:14px">Set a new password, then share it with ${esc(t.name)} directly (call / WhatsApp on <b class="mono">${esc(t.mobile||'—')}</b>). Their next sign-in uses the new password on any device.</p>
  <div class="field"><label class="fl">New password</label><input class="in" id="rp1" type="password" required></div>
  <div id="rpErr" class="notice red" style="display:none"></div>
  <button class="btn btn-primary" style="width:100%" id="rpBtn">Set password</button></form></div>`);
 $('#rpForm').onsubmit=async e=>{e.preventDefault();const err=m=>{const n=$('#rpErr');n.style.display='flex';n.innerHTML=ic('alert',15)+'<span>'+esc(m)+'</span>'};
  const pw=$('#rp1').value;if(pw.length<4)return err('Password too short');
  const b=$('#rpBtn');b.disabled=true;
  try{await adminResetPw(t,pw);
   if(reqId)dbUpdate('pwResets',reqId,{status:'done',doneTs:Date.now()});
   closeModal();toast('Password reset for '+t.name)}
  catch(ex){b.disabled=false;err(ex.code==='auth/email-already-in-use'?'This mobile already has an active account — try disabling/removing it first.':'Reset failed: '+ex.code)}}}

async function bulkWrite(c,docs){for(let i=0;i<docs.length;i+=400){const b=DB.batch();docs.slice(i,i+400).forEach(d=>b.set(DB.collection(c).doc(d.id||uid()),d));await b.commit()}}
async function bulkDelete(c,ids){for(let i=0;i<ids.length;i+=400){const b=DB.batch();ids.slice(i,i+400).forEach(id=>b.delete(DB.collection(c).doc(id)));await b.commit()}}
function vSettings(){setTop('Settings');setActiveNav('settings');const s=SET(),u=S.me;
 V().innerHTML=`<div class="pagehead"><div><div class="ptitle">Settings</div><div class="psub">Business identity & data · everything syncs live</div></div></div>
 <div class="grid2">
 <div class="card"><div class="cardhead"><span class="lbl">Business</span></div><div class="cardpad"><form id="stForm">
   <div class="field"><label class="fl">Business name</label><input class="in" id="st-biz" value="${esc(s.businessName)}" required></div>
   <div class="frow"><div class="field"><label class="fl">Currency symbol</label><input class="in" id="st-cur" value="${esc(s.currency)}"></div>
   <div class="field"><label class="fl">Currency word (print)</label><input class="in" id="st-cw" value="${esc(s.currencyWord)}"></div></div>
   <div class="field"><label class="fl">Phone (invoice header)</label><input class="in" id="st-ph" value="${esc(s.phone||'')}"></div>
   <div class="field"><label class="fl">Address (invoice header)</label><input class="in" id="st-ad" value="${esc(s.address||'')}"></div>
   <button class="btn btn-primary" style="width:100%">Save settings</button></form></div></div>
 <div>
   <div class="card" style="margin-bottom:14px"><div class="cardhead"><span class="lbl">Data & backup</span></div><div class="cardpad">
     <p class="muted" style="font-size:13px;margin-bottom:12px">Books live in Google Firestore — safe from device loss. Export a JSON backup for your records, or import one (imported accounts need a password reset in Users to activate sign-in).</p>
     <div style="display:flex;gap:10px;flex-wrap:wrap">
       <button class="btn btn-ghost" id="expBtn">${ic('down',16)}Export backup</button>
       <button class="btn btn-ghost" id="impBtn">${ic('up',16)}Import backup</button>
       <input type="file" id="impFile" accept="application/json" style="display:none">
       <button class="btn btn-ghost" id="seedBtn">${ic('layers',16)}Load sample data</button>
       ${can.wipe(u)?`<button class="btn btn-ghost" id="wipeBtn" style="color:var(--red)">${ic('trash',16)}Wipe everything</button>`:''}
     </div></div></div>
   <div class="card"><div class="cardhead"><span class="lbl">At a glance</span></div><div class="cardpad">
     <div class="lgrow"><span class="ld"><b>App version</b><span>${APP_VERSION}</span></span><span class="num" style="grid-column:span 3;text-align:right;font-weight:600">Munshi</span></div>
     <div class="lgrow"><span class="ld"><b>Documents</b><span>sales · purchases · returns</span></span><span class="num" style="grid-column:span 3;text-align:right;font-weight:600">${SALES().length+PURCHASES().length+SRET().length+PRET().length}</span></div>
     <div class="lgrow"><span class="ld"><b>Orders</b><span>customer portal</span></span><span class="num" style="grid-column:span 3;text-align:right;font-weight:600">${ORDERS().filter(o=>o.status==='new').length} waiting / ${ORDERS().length} total</span></div>
     <div class="lgrow"><span class="ld"><b>Parties</b><span>customers & suppliers</span></span><span class="num" style="grid-column:span 3;text-align:right;font-weight:600">${PARTIES().length}</span></div>
     <div class="lgrow"><span class="ld"><b>Items</b><span>catalogue</span></span><span class="num" style="grid-column:span 3;text-align:right;font-weight:600">${ITEMS().length}</span></div>
     <div class="lgrow" style="border:0"><span class="ld"><b>Stock value</b><span>weighted average</span></span><span class="num" style="grid-column:span 3;text-align:right;font-weight:600;color:var(--green)">${money(sum(stockRows(),r=>r.value))}</span></div>
   </div></div>
 </div></div>`;
 $('#stForm').onsubmit=e=>{e.preventDefault();const n=SET();n.businessName=$('#st-biz').value.trim()||n.businessName;n.currency=$('#st-cur').value.trim()||'₹';n.currencyWord=$('#st-cw').value.trim();n.phone=$('#st-ph').value.trim();n.address=$('#st-ad').value.trim();saveSet(n);toast('Settings saved — live on all devices')};
 $('#expBtn').onclick=async()=>{const data={settings:SET(),users:USERS(),parties:PARTIES(),categories:CATS(),brands:BRANDS(),items:ITEMS(),sales:SALES(),purchases:PURCHASES(),saleReturns:SRET(),purchaseReturns:PRET(),receipts:RECEIPTS(),payments:PAYMENTS(),orders:ORDERS(),stockAdj:ADJ(),pwResets:RESETS(),invites:INVITES()};
  try{const lg=await DB.collection('logins').get();data.logins=lg.docs.map(d=>Object.assign({id:d.id},d.data()))}catch(e){}
  const b=new Blob([JSON.stringify(data,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='munshi-backup-'+todayISO()+'.json';a.click();toast('Backup downloaded')};
 $('#impBtn').onclick=()=>$('#impFile').click();
 $('#impFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!d.settings)throw 0;
   confirmBox('Import backup?','Data will be added/replaced in your Firestore. This cannot be undone.',async()=>{
    toast('Importing… this may take a moment');
    const cfg={businessName:d.settings.businessName||'Munshi Traders',currency:d.settings.currency||'₹',currencyWord:d.settings.currencyWord||'',phone:d.settings.phone||'',address:d.settings.address||''};
    await DB.collection('settings').doc('config').set(cfg);
    if(d.settings.counters)await DB.collection('settings').doc('counters').set(d.settings.counters);
    for(const c of COLLECTION_KEYS){
     if(Array.isArray(d[c])&&d[c].length)await bulkWrite(c,d[c])}
    if(Array.isArray(d.logins)&&d.logins.length)await bulkWrite('logins',d.logins);
    for(const usr of (d.users||[])){if(usr.mobile)await DB.collection('logins').doc(String(usr.mobile)).set({email:mobileToEmail(String(usr.mobile))},{merge:true})}
    toast('Import complete — reset passwords in Users to activate sign-ins')})}
  catch(err){toast('Not a valid Munshi backup','err')}};rd.readAsText(f)};
 $('#seedBtn').onclick=()=>confirmBox('Load sample data?','Adds a demo month of transactions, a demo customer login (99999 00000 / 1234) and two sample orders.',async()=>{await seedDemo();toast('Sample data loaded');route()});
 const wb=$('#wipeBtn');if(wb)wb.onclick=()=>confirmBox('Wipe all data?','Every record in Firestore will be permanently deleted. Export a backup first!',async()=>{
  toast('Wiping…');
  for(const c of COLLECTION_KEYS)await bulkDelete(c,(state[c]||[]).map(x=>x.id));
  try{const lg=await DB.collection('logins').get();await bulkDelete('logins',lg.docs.map(d=>d.id))}catch(e){}
  await DB.collection('settings').doc('config').delete().catch(()=>{});
  await DB.collection('settings').doc('counters').delete().catch(()=>{});
  toast('Wiped — sign in again and run setup');logout()})}

async function seedDemo(){
 let _s=987654321;const rnd=()=>{_s=(_s*1103515245+12345)%2147483648;return _s/2147483648};const ri=(a,b)=>a+Math.floor(rnd()*(b-a+1));const pick=a=>a[Math.floor(rnd()*a.length)];
 const cats=['Chargers','Cables','Earphones & Buds','Power Banks','Cases & Covers','Screen Guards','Mounts & Holders','Memory Cards'].map(n=>({id:uid(),name:n}));
 const brands=['boAt','Portronics','Samsung','JBL','Wecool','Spigen','SanDisk','Mi'].map(n=>({id:uid(),name:n}));
 const cid=n=>cats.find(c=>c.name===n).id,bid=n=>brands.find(b=>b.name===n).id;
 const IT=[['boAt 33W Type-C Charger','Chargers','boAt',415,599,60,10],['Samsung 25W Adapter','Chargers','Samsung',820,1099,28,60],['Portronics Adapto 65W','Chargers','Portronics',1140,1499,25,10],['boAt Type-C Cable 1m','Cables','boAt',128,199,150,40],['Mi Braided USB-C 1.5m','Cables','Mi',158,249,120,30],['Samsung Data Cable','Cables','Samsung',105,175,140,30],['boAt Airdopes 141','Earphones & Buds','boAt',940,1299,55,15],['JBL Tune 125TWS','Earphones & Buds','JBL',2430,3299,26,50],['Wecool Mr.Bass Earbuds','Earphones & Buds','Wecool',660,999,44,12],['Mi 10000mAh Power Bank','Power Banks','Mi',975,1399,32,50],['boAt 20000mAh Power Bank','Power Banks','boAt',1630,2299,27,10],['Spigen Rugged Armor iPhone 15','Cases & Covers','Spigen',630,999,38,12],['Silicone Case Redmi Note 13','Cases & Covers','Wecool',82,149,200,30],['Clear Case Galaxy S23','Cases & Covers','Wecool',68,129,180,30],['Tempered Glass iPhone 15','Screen Guards','Wecool',44,99,300,50],['Tempered Glass Redmi Note 13','Screen Guards','Wecool',36,89,320,50],['Portronics MoBike Mount','Mounts & Holders','Portronics',375,599,40,10],['Magnet Dash Mount','Mounts & Holders','Wecool',148,249,58,12],['SanDisk 64GB microSD','Memory Cards','SanDisk',425,599,70,15],['SanDisk 128GB microSD','Memory Cards','SanDisk',810,1099,46,12]];
 const items=IT.map(x=>({id:uid(),name:x[0],sku:'',categoryId:cid(x[1]),brandId:bid(x[2]),unit:'Pcs',openingStock:x[5],openingRate:x[3],purchaseRate:x[3],saleRate:x[4],low:x[6]}));
 const customers=[['Sharma Mobile Centre','9832045510',8500],['Gupta Telecom','9811223344',0],['Sky Communications','9008877665',15200],['Mobile Point','7894561230',0],['Rajesh Accessories','9988776655',4300],['Digital World','9765432101',0]].map(x=>({id:uid(),name:x[0],type:'customer',phone:x[1],address:'',openingBalance:x[2],openingType:'dr',openingDate:addDays(todayISO(),-45)}));
 const suppliers=[['Wecool Distributors','9811000011',12000],['Sound Source Trading','9822000022',0],['Portronics Depot','9833000033',8600],['Samsung Zone','9844000044',0],['Global Accessories Co.','9855000055',0]].map(x=>({id:uid(),name:x[0],type:'supplier',phone:x[1],address:'',openingBalance:x[2],openingType:'cr',openingDate:addDays(todayISO(),-45)}));
 await bulkWrite('categories',cats);await bulkWrite('brands',brands);await bulkWrite('items',items);
 await bulkWrite('parties',customers.concat(suppliers));
 const custIds=customers.map(c=>c.id),supIds=suppliers.map(c=>c.id),modes=['Cash','UPI','Bank','Card'];
 const demoParty=customers[1];
 let demoUid='demo-cust';
 try{demoUid=await createAuthUser('9999900000@munshi.app','1234');
  const db2=DB.batch();
  db2.set(DB.collection('users').doc(demoUid),{name:'Gupta Telecom (Demo)',mobile:'9999900000',role:'customer',partyId:demoParty.id,active:true,created:Date.now()});
  db2.set(DB.collection('logins').doc('9999900000'),{email:'9999900000@munshi.app'});
  await db2.commit()}catch(e){console.warn('demo customer exists',e)}
 const salesA=[],purchA=[],sretA=[],pretA=[],recA=[],payA=[],ordA=[];
 const mkOL=()=>{const lines=[],used=new Set();for(let k=0;k<ri(2,4);k++){const it=pick(items);if(used.has(it.id))continue;used.add(it.id);lines.push({itemId:it.id,qty:ri(2,8),rate:it.saleRate})}return lines};
 const l1=mkOL(),s1=sum(l1,x=>x.qty*x.rate);
 ordA.push({id:uid(),no:'ORD-0001',date:todayISO(),userId:demoUid,partyId:demoParty.id,lines:l1,subtotal:s1,total:s1,status:'new',note:'Please deliver before 6 pm',history:[{ts:Date.now()-36e5,status:'new',by:'Gupta Telecom'}],created:Date.now()-36e5});
 const l2=mkOL(),s2=sum(l2,x=>x.qty*x.rate);
 ordA.push({id:uid(),no:'ORD-0002',date:addDays(todayISO(),-2),userId:demoUid,partyId:demoParty.id,lines:l2,subtotal:s2,total:s2,status:'confirmed',note:'',history:[{ts:Date.now()-2*864e5,status:'new'},{ts:Date.now()-864e5,status:'confirmed',by:'Admin'}],created:Date.now()-2*864e5});
 let si=0,pi=0,sri=0,pri=0;
 for(let i=34;i>=0;i--){const date=addDays(todayISO(),-i),created=Date.now()-i*864e5+ri(9,19)*36e5;
  if(i%4===1){const lines=[],used=new Set();for(let k=0;k<ri(3,6);k++){const it=pick(items);if(used.has(it.id))continue;used.add(it.id);lines.push({itemId:it.id,qty:ri(10,40),rate:it.purchaseRate})}
   if(lines.length){const sub=sum(lines,l=>l.qty*l.rate),r=rnd(),paid=r<0.55?sub:r<0.8?Math.round(sub*0.5/100)*100:0;
    purchA.push({id:uid(),no:'PI-'+String(++pi).padStart(4,'0'),date,partyId:pick(supIds),lines,subtotal:sub,total:sub,paid,payMode:paid?pick(modes):'Credit',note:'',created})}}
  for(let s=0;s<ri(1,3);s++){const lines=[],used=new Set();for(let k=0;k<ri(1,4);k++){const it=pick(items);if(used.has(it.id))continue;used.add(it.id);lines.push({itemId:it.id,qty:ri(1,6),rate:it.saleRate})}
   if(!lines.length)continue;const sub=sum(lines,l=>l.qty*l.rate),disc=rnd()<0.2?ri(20,150):0,total=sub-disc,r=rnd(),paid=r<0.6?total:r<0.8?Math.round(total*ri(30,70)/100/10)*10:0;
   salesA.push({id:uid(),no:'SI-'+String(++si).padStart(4,'0'),date,partyId:pick(custIds),lines,subtotal:sub,discount:disc,total,paid,payMode:paid?pick(modes):'Credit',note:'',created:created+s*6e4})}
  if(rnd()<0.5)recA.push({id:uid(),date,partyId:pick(custIds),amount:ri(20,120)*500,mode:pick(modes),note:'Collection round',created:created+3e5});
  if(rnd()<0.3)payA.push({id:uid(),date,partyId:pick(supIds),amount:ri(30,180)*500,mode:pick(modes),note:'',created:created+4e5});
  if(rnd()<0.14){const lines=[];for(let k=0;k<ri(1,2);k++){const it=pick(items);lines.push({itemId:it.id,qty:ri(1,2),rate:it.saleRate})}
   const tv=sum(lines,l=>l.qty*l.rate),cash=rnd()<0.4;
   sretA.push({id:uid(),no:'SR-'+String(++sri).padStart(4,'0'),date,partyId:pick(custIds),lines,subtotal:tv,total:tv,goodsBack:rnd()<0.8,settle:cash?'cash':'credit',cashAmount:cash?tv:0,payMode:cash?pick(modes):'',note:'',created:created+5e5})}
  if(rnd()<0.09){const lines=[];for(let k=0;k<ri(1,2);k++){const it=pick(items);lines.push({itemId:it.id,qty:ri(2,5),rate:it.purchaseRate})}
   const tv=sum(lines,l=>l.qty*l.rate),cash=rnd()<0.35;
   pretA.push({id:uid(),no:'PR-'+String(++pri).padStart(4,'0'),date,partyId:pick(supIds),lines,subtotal:tv,total:tv,goodsBack:true,settle:cash?'cash':'credit',cashAmount:cash?tv:0,payMode:cash?pick(modes):'',note:'',created:created+6e5})}}
 await bulkWrite('sales',salesA);await bulkWrite('purchases',purchA);await bulkWrite('saleReturns',sretA);await bulkWrite('purchaseReturns',pretA);
 await bulkWrite('receipts',recA);await bulkWrite('payments',payA);await bulkWrite('orders',ordA);
 await DB.collection('settings').doc('counters').set({SI:si,PI:pi,SR:sri,PR:pri,ORD:ordA.length});
 await DB.collection('stockAdj').add({itemId:items[6].id,delta:-2,rate:0,reason:'Damaged / dead stock',date:addDays(todayISO(),-3),by:S.me.name,created:Date.now()-3*864e5});
 const st=SET();saveSet(Object.assign({},st,{welcomed:true}))}

function route(){
 try{
 const raw=location.hash||'',p=raw.replace(/^#\//,'').split('/').filter(Boolean),u=S.me;
 if(p[0]==='login'){if(u){go(u.role==='customer'?'shop':'dash');return}renderLogin();return}
 if(p[0]==='setup'){if(u){go(u.role==='customer'?'shop':'dash');return}renderSetup();return}
 if(p[0]==='join'){if(u){go(u.role==='customer'?'shop':'dash');return}renderJoin();return}
 if(p[0]==='register'){if(u){go(u.role==='customer'?'shop':'dash');return}renderRegister();return}
 if(!u){go('login');return}
 if(!document.querySelector('.side'))renderShell();
 updateBadges();
 const a=p[0]||(u.role==='customer'?'shop':'dash');
 if(u.role==='customer'){
  if(a==='shop')return vShop();
  if(a==='cart')return vCart();
  if(a==='my-orders')return p[1]?vOrderDetail(p[1],true):vMyOrders();
  if(a==='account'){if(!V().innerHTML)vShop();openAccountSheet();return}
  go('shop');return}
 if(a==='shop'||a==='cart'||a==='my-orders'){go('dash');return}
 if(u.role==='company'){
  if(a==='dash')return vDashCompany();
  if(a==='r'&&p[1]==='stock')return vReportStock();
  go('dash');return}
 if(a==='dash')return vDash();
 if(a==='orders')return p[1]?vOrderDetail(p[1]):vOrders();
 if(['sales','purchases','sale-returns','purchase-returns'].includes(a)){
  const type={'sales':'sale','purchases':'purchase','sale-returns':'saleReturn','purchase-returns':'purchaseReturn'}[a];
  if(p[1]==='new')return vDocForm(type,null);
  if(p[1]==='edit')return vDocForm(type,p[2]);
  if(p[1]==='view')return vDocView(type,p[2]);
  return vDocs(type)}
 if(a==='parties')return p[1]?vPartyDetail(p[1]):vParties();
 if(a==='items')return vItems();
 if(a==='categories')return vCats();
 if(a==='brands')return vBrands();
 if(a==='ledger')return vLedger(p[1]);
 if(a==='collections'||a==='payments'){const k=a==='collections'?'receipt':'payment';
  if(p[1]==='new')return vMoneyForm(k,p[2]);
  if(p[1]==='edit')return vMoneyForm(k,null,p[2]);
  return vMoneyList(k)}
 if(a==='r'){
  if(p[1]==='profit'&&!can.profit(u)){toast('Profit analysis is admin-only','err');return vDash()}
  const map={stock:vReportStock,sales:vReportSales,purchase:vReportPurchase,collection:vReportCollection,payment:vReportPayment,profit:vReportProfit};
  if(map[p[1]])return map[p[1]]()}
 if(a==='users'){if(!can.users(u)){toast('Admin only','err');return vDash()}return vUsers()}
 if(a==='settings'){if(!can.settings(u)){toast('Admin only','err');return vDash()}return vSettings()}
 go('dash');
 }catch(e){console.error(e);showFatal(e.message)}}
window.addEventListener('hashchange',route);
window.closeModal=closeModal;
(function boot(){
 console.log('Munshi '+APP_VERSION);
 if(!FIREBASE_CONFIG.apiKey||FIREBASE_CONFIG.apiKey.startsWith('PASTE')){renderConfigNeeded();return}
 firebase.initializeApp(FIREBASE_CONFIG);
 auth=firebase.auth();DB=firebase.firestore();
 try{DB.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}
 auth.onAuthStateChanged(async fu=>{
  S.unsubs.forEach(u=>{try{u()}catch(e){}});S.unsubs=[];
  if(!fu){S.me=null;S.booting=false;route();return}
  S.booting=true;showLoading('Loading your live books…');
  try{
   const ud=await DB.collection('users').doc(fu.uid).get();
   if(!ud.exists){await auth.signOut();S.booting=false;showLoading('Account data missing — please sign in again.');setTimeout(()=>route(),1600);return}
   const me=Object.assign({id:fu.uid},ud.data());
   if(me.active===false){await auth.signOut();S.booting=false;showLoading('This account is disabled. Contact your admin.');setTimeout(()=>route(),1600);return}
   S.me=me;
   subscribeAll(me);
   await new Promise(r=>setTimeout(r,450));
   S.booting=false;renderShell();
   const cur=(location.hash||'').replace(/^#\//,'').split('/')[0];
   if(['login','setup','join'].includes(cur)||!cur)go(me.role==='customer'?'shop':'dash');else route();
  }catch(e){console.error(e);S.booting=false;showFatal('Connection problem: '+(e.code||e.message)+' — check internet and refresh.')}
 });
})();
</script>
